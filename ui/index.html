function workflowEngine(t){return ['codex','claude','workbuddy'].includes(t.engine)?t.engine:'codex';}
function workflowEngineName(e){return ({codex:'Codex',claude:'Claude',workbuddy:'WorkBuddy'})[e]||e;}
function workflowStateName(s){return ({scheduled:'待执行',dispatching:'正在提交',accepted:'已接收',queued:'排队中',running:'执行中',reconciling:'核对中',needs_review:'需要确认',completed:'已完成',failed:'失败',cancelled:'已取消'})[s]||s;}
function workflowRequestId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():('wf-'+Date.now()+'-'+Math.random().toString(36).slice(2));}
let WORKFLOW_CAPABILITY={checkedAt:0,ready:false,pending:null};
async function workflowBackendReady(){
  if(Date.now()-WORKFLOW_CAPABILITY.checkedAt<30000)return WORKFLOW_CAPABILITY.ready;
  if(!WORKFLOW_CAPABILITY.pending)WORKFLOW_CAPABILITY.pending=api('/api/health',{timeout:3000}).then(h=>Number(h.workflowVersion)>=2).catch(()=>false).then(ready=>{
    WORKFLOW_CAPABILITY={checkedAt:Date.now(),ready,pending:null};return ready;
  });
  return WORKFLOW_CAPABILITY.pending;
}
async function workflowSheet(t){
  if(!await workflowBackendReady()){toast('定时与交接功能正在等待网关更新，请稍后重试。',4200);return;}
  openSheet('定时与交接',[
    {ico:'clock',label:'定时执行',sub:'到时在当前会话提交一次',onPick:()=>workflowCompose(t,'scheduled')},
    {ico:'forward',label:'交接到已有会话',sub:'只传递你填写的说明，不复制聊天记录',onPick:()=>workflowCompose(t,'handoff')},
    {ico:'list',label:'查看与管理任务',onPick:()=>workflowManager(t)}
  ]);
}
async function workflowLoadTargets(current){
  const engines=['codex','claude','workbuddy'];
  const results=await Promise.allSettled(engines.map(e=>api('/api/threads?engine='+e+'&limit=300')));
  const targets=[];
  results.forEach((result,index)=>{
    if(result.status!=='fulfilled')return;
    const rows=result.value.threads||result.value.data||[];
    rows.forEach(row=>{
      const engine=workflowEngine(Object.assign({engine:engines[index]},row));
      if(row.archived||row.missingTranscript||!row.id||(engine===workflowEngine(current)&&row.id===current.id))return;
      targets.push({id:row.id,engine,title:threadTitle(row)});
    });
  });
  return targets;
}
function workflowLocalValue(date){
  const d=new Date(date.getTime()-date.getTimezoneOffset()*60000);
  return d.toISOString().slice(0,16);
}
async function workflowCompose(source,kind){
  const seq=openSheet(kind==='scheduled'?'新建定时任务':'创建会话交接',[]);
  const body=$('#sheet .sh-body');
  if(!body)return;
  body.innerHTML='';
  const form=el('div','wf-form');
  const targetSelect=document.createElement('select');
  let time=null;
  let targets=[];
  if(kind==='handoff'){
    const loading=el('div','sh-note','正在读取可用会话…');form.appendChild(loading);body.appendChild(form);
    try{targets=await workflowLoadTargets(source);}catch(e){targets=[];}
    if(seq!==SHEET_SEQ||!$('#sheetWrap').classList.contains('show'))return;
    loading.remove();
  }
  const targetField=el('label','wf-field');
  targetField.appendChild(el('span',null,kind==='scheduled'?'执行会话':'目标会话'));
  if(kind==='scheduled'){
    const only=document.createElement('input');only.readOnly=true;only.value=threadTitle(source)+' · '+workflowEngineName(workflowEngine(source));targetField.appendChild(only);
  }else{
    targets.forEach(target=>{const option=document.createElement('option');option.value=target.engine+'\t'+target.id;option.textContent=workflowEngineName(target.engine)+' · '+target.title;targetSelect.appendChild(option);});
    if(!targets.length){const option=document.createElement('option');option.value='';option.textContent='没有可交接的目标会话';targetSelect.appendChild(option);targetSelect.disabled=true;}
    targetField.appendChild(targetSelect);
  }
  form.appendChild(targetField);
  if(kind==='scheduled'){
    const timeField=el('label','wf-field');timeField.appendChild(el('span',null,'执行时间（本地时区）'));
    time=document.createElement('input');time.type='datetime-local';time.min=workflowLocalValue(new Date());
    const initial=new Date(Date.now()+30*60000);initial.setSeconds(0,0);time.value=workflowLocalValue(initial);timeField.appendChild(time);form.appendChild(timeField);
  }
  const instructionField=el('label','wf-field');instructionField.appendChild(el('span',null,'任务说明'));
  const instruction=document.createElement('textarea');instruction.maxLength=12000;instruction.placeholder='写清要执行的任务、范围和验收条件';instructionField.appendChild(instruction);form.appendChild(instructionField);
  form.appendChild(el('div','sh-note',kind==='handoff'?'仅发送这段说明和来源会话标识；聊天历史不会自动复制。':'任务到期后只提交一次；结果未知时会暂停并等待确认。'));
  const submit=el('button','wf-submit',kind==='scheduled'?'创建定时任务':'创建交接');submit.type='button';form.appendChild(submit);
  const feedback=el('div','sh-note');form.appendChild(feedback);body.appendChild(form);
  const pendingKey='an-workflow-pending:'+kind+':'+source.id;
  let pendingId=null,pendingPayload=null;
  try{
    const saved=JSON.parse(sessionStorage.getItem(pendingKey)||'null');
    if(saved&&saved.payload&&saved.payload.requestId){
      pendingPayload=saved.payload;pendingId=saved.payload.requestId;instruction.value=saved.payload.instruction||'';
      if(time&&saved.payload.runAt)time.value=workflowLocalValue(new Date(saved.payload.runAt));
      if(kind==='handoff'&&saved.payload.targetThreadId)targetSelect.value=saved.payload.targetEngine+'\t'+saved.payload.targetThreadId;
      feedback.textContent='已恢复上次提交标识；重试会读取原任务，不会新建重复任务。';
      instruction.disabled=true;if(time)time.disabled=true;if(targetSelect.options.length)targetSelect.disabled=true;
      submit.textContent='用同一请求标识重试';
    }
  }catch(e){}
  submit.onclick=async function(){
    if(!pendingPayload){
      const text=instruction.value.trim();
      if(!text){instruction.focus();feedback.textContent='请填写任务说明。';return;}
      let targetId=source.id,targetEngine=workflowEngine(source);
      if(kind==='handoff'){
        const parts=String(targetSelect.value||'').split('\t');targetEngine=parts[0];targetId=parts.slice(1).join('\t');
        if(!targetId){feedback.textContent='请选择一个目标会话。';return;}
      }
      const runAt=kind==='scheduled'?time.value:null;
      if(kind==='scheduled'&&(!runAt||new Date(runAt).getTime()<=Date.now())){feedback.textContent='执行时间必须晚于现在。';return;}
      pendingId=workflowRequestId();
      pendingPayload={kind,targetThreadId:targetId,targetEngine,sourceThreadId:source.id,sourceEngine:workflowEngine(source),
        instruction:text,title:text.split(/\r?\n/)[0].slice(0,120),runAt:runAt?new Date(runAt).toISOString():new Date().toISOString(),requestId:pendingId};
      try{sessionStorage.setItem(pendingKey,JSON.stringify({payload:pendingPayload}));}catch(e){}
    }
    submit.disabled=true;feedback.textContent='正在保存任务…';
    try{
      await api('/api/workflows',{method:'POST',body:pendingPayload,timeout:30000});
      pendingId=null;pendingPayload=null;try{sessionStorage.removeItem(pendingKey);}catch(e){}toast('任务已保存');workflowManager(source);
    }catch(e){
      const status=Number(e&&e.status||0);
      if(status>=400&&status<500&&status!==409){pendingId=null;pendingPayload=null;try{sessionStorage.removeItem(pendingKey);}catch(x){}}
      else{
        instruction.disabled=true;if(time)time.disabled=true;if(targetSelect.options.length)targetSelect.disabled=true;
        submit.textContent='用同一请求标识重试';
      }
      feedback.textContent=status===409?'请求标识冲突，任务结果需要核对；不会自动生成新的任务。':
        (status>=400&&status<500?'保存失败：'+apiErrText(e,'任务'):'提交结果未确认。再次提交会沿用同一请求标识，不会创建新任务。');
      submit.disabled=false;
    }
  };
}
async function workflowManager(thread){
  const seq=openSheet('任务管理',[{loading:'正在读取任务…'}]);
  async function refresh(){
    try{
      const result=await api('/api/workflows?threadId='+encodeURIComponent(thread.id));
      if(seq!==SHEET_SEQ||!$('#sheetWrap').classList.contains('show'))return;
      const body=$('#sheet .sh-body');body.innerHTML='';
      const rows=result.data||[];
      const refreshButton=el('button','wf-submit','刷新状态');refreshButton.type='button';refreshButton.onclick=refresh;body.appendChild(refreshButton);
      if(!rows.length){body.appendChild(el('div','sh-note','没有相关任务。'));return;}
      const list=el('div','wf-list');
      rows.forEach(task=>{
        const row=el('div','wf-row');const head=el('div','wf-row-head');
        head.appendChild(el('div','wf-row-title',task.title||task.instruction||'任务'));
        head.appendChild(el('span','badge',workflowStateName(task.state)));row.appendChild(head);
        const target=workflowEngineName(task.target_engine)+' · '+(task.target_thread_id===thread.id?threadTitle(thread):String(task.target_thread_id).slice(0,14));
        const when=task.run_at?new Date(task.run_at*1000).toLocaleString():'时间未知';
        row.appendChild(el('div','wf-row-meta',(task.kind==='handoff'?'交接':'定时')+' · '+target+' · '+when));
        if(task.last_error)row.appendChild(el('div','wf-row-meta',task.last_error));
        const actions=el('div','wf-row-actions');
        async function act(action,label,danger){
          const button=el('button',danger?'danger':null,label);button.type='button';
          button.onclick=async()=>{
            if(action==='complete'&&!window.confirm('请先确认目标会话已完成，或你已核实该任务结果。此操作只更新任务状态，不会中断模型回合。'))return;
            button.disabled=true;try{await api('/api/workflows/'+encodeURIComponent(task.id)+'/'+action,{method:'POST',body:{}});toast('任务状态已更新');await refresh();}catch(e){button.disabled=false;toast(apiErrText(e,'任务'),5000);}
          };
          actions.appendChild(button);
        }
        if(task.state==='scheduled'){act('cancel','取消任务',true);}
        else if(task.state==='needs_review'){
          if(task.outcomeUnknown)act('reconcile','继续核对原请求');
          else act('resume','恢复执行');
          if(!task.outcomeUnknown)act('cancel','取消任务',true);
          else act('complete','确认已完成');
        }else if(['accepted','queued','running','reconciling'].includes(task.state))act('complete','确认已完成');
        if(actions.childNodes.length)row.appendChild(actions);
        list.appendChild(row);
      });
      body.appendChild(list);
    }catch(e){
      if(seq!==SHEET_SEQ)return;const body=$('#sheet .sh-body');body.innerHTML='';body.appendChild(el('div','sh-note warn',apiErrText(e,'读取任务')));
    }
  }
  await refresh();
}

async function newThreadIn(cwd){
  if(S.viewonly){ toast('只读模式：不能新建会话'); return false; }
  if(S._newThreadBusy){ toast('正在新建会话，请稍候…',2600); return false; }
  S._newThreadBusy=true;
  const _en=({codex:'Codex',claude:'Claude',workbuddy:'WorkBuddy'})[S.engine]||'Codex';
  toast('正在新建 '+_en+' 会话…',6000,'plus');
  try{
    const dest=cleanFsPath(cwd||'');
    const _nb={};
    if(dest) _nb.cwd=dest;
    if(S.engine==='codex' && dest){
      const project=(S.projects||[]).find(project=>pathNorm(project.path)===pathNorm(dest))||
        (S.projects||[]).find(project=>(project.rootPaths||[]).some(root=>pathNorm(root)===pathNorm(dest)));
      if(project)_nb.projectId=project.id;
    }
    _nb.engine=S.engine;
    const _sm=pickSendModel(S.engine,true), _se=pickSendEffort(S.engine,true);
    if(_sm) _nb.model=_sm;
    if(_se) _nb.effort=_se;
    const res=await api('/api/threads/new',{method:'POST',body:_nb,timeout:60000});
    const t=res.thread||{};
    if(dest) rememberNewThreadCwd(dest);
    if(t.id){
      /* 空会话还没有任何回合：后端列表会把它过滤掉，详情接口对这个 CLI 的空会话
         也会回 list_turns not supported。这里先在前端占位 + 放空缓存：
         侧栏立刻出现分组，聊天页立刻显示“尚无消息”，不用等两次网络往返。 */
      const _cwd=dest||t.cwd||'';
      const _now=Date.now()/1000;
      const _row=Object.assign({},t,{
        cwd:_cwd, engine:S.engine, title:'', name:'', preview:'', firstUserMessage:'',
        createdAt:t.createdAt||Math.floor(_now), updatedAt:_now, recencyAt:_now,
        running:false, writable:true, _pendingNew:true
      });
      CHATCACHE[t.id]=Object.assign({},_row,{turns:[]});
      S.threads=S.threads.filter(function(x){ return x.id!==t.id; });
      S.threads.unshift(_row);
      S.threadsById.set(t.id,_row);
      pendingAdd(_row);
      if(S.wide || viewNow().name==='list' || $('#listView').style.display!=='none') renderList();
      openChat(t.id);
      toast(t.pendingTranscript?'已建本地草稿；发送首条消息后登记到原生会话':'已新建会话',t.pendingTranscript?4200:1600);
    }
    return true;
  }catch(e){
    if(apiErrInfo(e).code==='folder_not_found') clearLastFolderIf(cwd||'');
    toast(apiErrText(e,'新建会话'),6200);
    return false;
  }finally{
    S._newThreadBusy=false;
  }
}

function createFolderIn(parent,name,onCreated){
  parent=cleanFsPath(parent);
  name=String(name==null?'':name).trim();
  if(!parent){ toast('先选择一个父文件夹'); return Promise.resolve(false); }
  if(!name){ toast('文件夹名称不能为空'); return Promise.resolve(false); }
  if(S._mkdirBusy){ toast('正在新建文件夹，请稍候…',2600); return Promise.resolve(false); }
  S._mkdirBusy=true;
  const finalPath=joinFsPath(parent,name);
  return api('/api/fs/mkdir',{method:'POST',body:{path:parent,name:name},timeout:20000})
    .then(async function(res){
      const made=cleanFsPath((res&&res.path)||finalPath);
      if(S.engine==='codex'){
        await api('/api/projects/create',{method:'POST',body:{path:made,name:name},timeout:20000});
        S.locationsAt=0;await loadThreads(true);
      }
      FILES_SIG=null;
      try{ filesTick(); }catch(e){}
      toast('已新建文件夹：'+(res&&res.name||name),2400,'folder');
      if(onCreated) onCreated(made);
      return true;
    })
    .catch(function(e){
      if(apiErrInfo(e).code==='folder_not_found') clearLastFolderIf(parent);
      toast(apiErrText(e,'新建文件夹'),5600);
      return false;
    })
    .then(function(ok){ S._mkdirBusy=false; return ok; },function(e){ S._mkdirBusy=false; throw e; });
}

const PICK_NEW_BY={codex:{model:null,effort:null},claude:{model:null,effort:null},workbuddy:{model:null,effort:null}};

    models:(c&&c.models)||[],

    defaultModel:(c&&c.defaultModel)||null,

function modelLabel(m){

  if(hit&&hit.label) return hit.label;
  const ks=['codex','claude','workbuddy'];
  for(let i=0;i<ks.length;i++){

// 本 Agent 的实际生效值: 手动/会话选择 > 本机配置默认; 不属于这个 Agent 的模型直接丢弃
function pickEffective(eng){

  try{

const PICK_LAST = new Map();   // tid -> {key, done}：最后一次排队的完整目标（连续重复点击只发一次）
const PICK_CHAIN = new Map();  // tid -> 串行链（A/B/C 快速切换按点击顺序落地）
async function pickApply(patchObj, revert){
  const k=pickEngKey(pickEngine()), st=pickState(k);
  if(patchObj.model!==undefined) st.model=patchObj.model;
  if(patchObj.effort!==undefined) st.effort=patchObj.effort;
  chipSync();
  if(S.viewonly){ if(revert) revert(); toast('只读模式不能切换'); return false; }
  if(!S.curId || !viewNow() || viewNow().name!=='chat'){
    toast('已保存为 '+(({codex:'Codex',claude:'Claude',workbuddy:'WorkBuddy'})[k]||k)+' 的新会话默认',3000,'think');
    return true;
  }
  const tid=S.curId;
  // 用“完整目标”去重，而不是用 patch：A→B→A 时第二次 A 必须排在 B 后面。
  const targetKey=tid+'|'+k+'|'+(st.model||'')+'|'+(st.effort||'');
  const last=PICK_LAST.get(tid);
  if(last && !last.done && last.key===targetKey) return Promise.resolve(false);
  const entry={key:targetKey, done:false};
  PICK_LAST.set(tid,entry);
  const prev=PICK_CHAIN.get(tid)||Promise.resolve();
  const task=prev.catch(function(){}).then(function(){
    return api('/api/threads/'+encodeURIComponent(tid)+'/settings',{method:'POST',body:patchObj,timeout:65000}).then(function(result){
      if(result.deferred || result.note==='applies after current turn'){

        return false;
      }
      if(S.curId!==tid)return false;
      if(S.cur){ if(patchObj.model) S.cur.model=patchObj.model; if(patchObj.effort) S.cur.reasoningEffort=patchObj.effort; }

      const m=String(e.message||'');

      else toast('设置失败: '+m, 4200);
      // 只有当前选择还停在这一个目标时才回滚，避免把用户后来点的更新值冲掉
      const stillMine=(patchObj.model===undefined||st.model===patchObj.model)&&(patchObj.effort===undefined||st.effort===patchObj.effort);
      if(revert&&stillMine) revert();
      return false;
    });
  });
  const tail=task.catch(function(){});
  PICK_CHAIN.set(tid,tail);
  tail.then(function(ok){
    entry.done=true;
    if(!ok && PICK_LAST.get(tid)===entry) PICK_LAST.delete(tid);
    if(PICK_CHAIN.get(tid)===tail) PICK_CHAIN.delete(tid);
  });
  return task;
}

function adoptOptimistic(key, node, label){

     reloadChat 可能先于历史写入，一删就会把刚发的气泡吞掉。
     标记为已确认，等 renderChat 真正看到历史条目后再清理。 */
  node._confirmed=1; node._confirmedAt=Date.now();
  for(const [k,n] of Array.from(S.opt)){ if(n===node){ n._confirmed=1; n._confirmedAt=Date.now(); } }
  const old=S.nodes.get(key);

  const _confirmedN=Math.max(Number(node._baseN||0)+1, confirmedUserCount());

  for(const n of Array.from(S.opt.values())){

let ATTACH=[];
function isImgFile(f){
  if(!f) return false;
  const t=String(f.type||'').toLowerCase();
  if(t.indexOf('image/')===0) return true;
  if(t) return false;                                    // 明确不是图片
  return /\.(png|jpe?g|gif|webp|heic|heif|bmp|tiff?|avif)$/i.test(String(f.name||''));
}
function mimeOfFile(f){
  const t=String((f&&f.type)||'').toLowerCase();
  if(t.indexOf('image/')===0) return t;
  const n=String((f&&f.name)||'');
  if(/\.jpe?g$/i.test(n)) return 'image/jpeg';
  if(/\.gif$/i.test(n)) return 'image/gif';
  if(/\.webp$/i.test(n)) return 'image/webp';
  if(/\.(heic|heif)$/i.test(n)) return 'image/heic';
  if(/\.avif$/i.test(n)) return 'image/avif';
  if(/\.bmp$/i.test(n)) return 'image/bmp';
  if(/\.tiff?$/i.test(n)) return 'image/tiff';
  return 'image/png';
}
// 浏览器解不开的格式(HEIC/超大 BMP): 原样发走, 至少文件进了会话, 不再直接失败
function rawAttachment(file){
  return new Promise(function(resolve){
    if(!file || file.size>12*1024*1024){ resolve(null); return; }
    const fr=new FileReader();
    fr.onload=function(){
      let du=String(fr.result||'');
      if(du.indexOf('data:image/')!==0){ du='data:'+mimeOfFile(file)+du.slice(du.indexOf(';')); }
      resolve({dataUrl:du, raw:true});
    };
    fr.onerror=function(){ resolve(null); };
    fr.readAsDataURL(file);
  });
}

function fileToAttachment(file){
  return new Promise(resolve=>{
    if(!isImgFile(file)){ resolve(null); return; }
    if(file.type==='image/gif'){
      const fr=new FileReader();
      fr.onload=()=>resolve({dataUrl:String(fr.result)});
      fr.onerror=()=>resolve(null);
      fr.readAsDataURL(file);
      return;
    }
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      let out=null;
      try{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        const k=Math.min(1, ATCH_MAXSIDE/Math.max(w,h));
        w=Math.max(1,Math.round(w*k)); h=Math.max(1,Math.round(h*k));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const cx=cv.getContext('2d');
        cx.fillStyle='#ffffff'; cx.fillRect(0,0,w,h);
        cx.drawImage(img,0,0,w,h);
        let dataUrl=cv.toDataURL('image/png');
        if(file.type==='image/jpeg' || dataUrl.length>4.2*1024*1024){ dataUrl=cv.toDataURL('image/jpeg',0.85); }
        out={dataUrl:dataUrl};
      }catch(e){ out=null; }
      URL.revokeObjectURL(url);
      if(out) resolve(out);
      else rawAttachment(file).then(resolve);     // canvas 解不了(HEIC 等) -> 原图兜底
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rawAttachment(file).then(resolve); };
    img.src=url;
  });
}

        ? {id:mid,type:'userMessage',content:[{type:'text',text:txt}]}
        : {id:mid,type:'agentMessage',text:txt});
    const turnId=String(m.turnId||('tail-turn-'+mid));

    if(!turn){turn={id:turnId,status:m.turnStatus||(m.turnId?null:'completed'),items:[]};grouped.set(turnId,turn);turns.push(turn);}

    else{const items=target.items;Object.assign(target,turn);target.items=items;}

    let items=before.items||[];

      const ids=new Set((turn.items||[]).map(item=>String(item.id)));
      items=items.filter(item=>item.type==='userMessage'||ids.has(String(item.id)));

  const before=[];

  for(const tn of (prev.turns||[])){
    const ids=(tn.items||[]).map(function(it){ return it&&it.id?String(it.id):''; }).filter(Boolean);

async function postTurnRetry(tid, body, tries, onRetry){
  const maxTries=tries||3; let lastErr=null;

    if(i){ if(onRetry) onRetry(i+1); await sleepMs(700*i); }

      if(r.status===502||r.status===504){ lastErr=new Error('HTTP '+r.status+'（隧道间歇故障）'); continue; }

      if(!r.ok){ const er=j&&j.error; const msg=(er&&(er.message||JSON.stringify(er)))||('HTTP '+r.status); const err=new Error(msg); err.code=er&&er.code; err.noRetry=true; throw err; }

    }catch(e){

      const m=String((e&&e.message)||'');
      const netErr=(e instanceof TypeError)||/Failed to fetch|Load failed|NetworkError|network error/i.test(m);
      if(!netErr) throw e;
      lastErr=e;
    }
  }
  throw lastErr||new Error('发送失败，请重试');

async function stopTurn(){
  if(!S.curId || _stopBusy) return;
  // 写锁不在本网关: 不论回合是否在跑, “停止”一律先夺控制权。
  // 正在跑就二次确认(会打断电脑端), 空闲就直接清掉僵尸锁。
  if(S.curWritable===false){
    forceTakeoverConfirm(S.curId,{forceConfirm:!!S.running, lock:S.lockInfo});
    return;
  }
  _stopBusy=true;
  S.stopping=true; renderTurnStatus();
  const b=$('#stopB2'); if(b) b.classList.add('busy');
  const tid=S.curId;
  const post=function(){ return api('/api/threads/'+encodeURIComponent(tid)+'/interrupt',{method:'POST',body:{}}); };
  try{
    let r=null;
    try{ r=await post(); }
    catch(e){
      const m=String((e&&e.message)||'');
      const transient=(e instanceof TypeError)||/502|503|504|Failed to fetch|Load failed|network/i.test(m);
      if(!transient) throw e;
      await new Promise(function(res){ setTimeout(res,600); });
      r=await post();
    }
    if(r && r.stopped===false){
      if(r.reason==='pc_holds_lock'){
        forceTakeoverConfirm(tid,{forceConfirm:true, lock:S.lockInfo});
      }else{
        toast('这一回合已经结束了（没有正在跑的回合）',3400);
      }
      resyncRun(); refreshQueue(true);
    }else{
      markStopping();
      const kept=(r && typeof r.queueKept==='number')? r.queueKept : -1;
      const _nw=Date.now(); const _sp=(_nw-(S._stopT||0)<3000); S._stopT=_nw;
      const base=(kept>0)? ('已停止 · 队列还剩 '+kept+' 条，已自动续跑') : '已停止';
      const joke=(typeof EGGON!=='undefined' && EGGON)? egg('stopMsg','') : '';
      toast(base+(joke? ' · '+joke : '')+(_sp? ' · 又踹了一脚':''), 3400);
      [600,1500,3000,6000].forEach(function(ms){ setTimeout(function(){ resyncRun(); refreshQueue(true); }, ms); });
    }
  }catch(e){
    const m=String((e&&e.message)||'');
    S.stopping=false; renderTurnStatus();
    if(/no running turn/i.test(m)){ toast('这一回合已经结束了（没有正在跑的回合）',4000); resyncRun(); }
    else toast('停止失败: '+m+'（可再点一次）',4200);
  }finally{
    _stopBusy=false;
    if(b) b.classList.remove('busy');
  }
}

  if(ext==='diff'||ext==='patch') return 'diff';

      const _under=(a,b)=>!!b && a!==b && a.indexOf(b+'\\')===0;
      const _top=[], _sub=[];
      for(const r of _rest){ let _n=false; for(const o of _rest){ if(_under(_nrm(r),_nrm(o))){ _n=true; break; } } (_n?_sub:_top).push(r); }
      const _rowOf=(rt,icon)=>{ const row=el('div','frow'); row.appendChild(ic(icon,'fi')); row.appendChild(el('span','fn',rt.name)); row.appendChild(el('span','fs',rt.path.length>30? '…'+rt.path.slice(-30): rt.path)); row.onclick=()=>nav({name:'files', path:rt.path, from:v.from}); return row; };
      /* 顺序：一级位置 → 项目 → 子目录。
         一级位置是盘符下一级的工作盘（E:\ExampleProject 这类），用户最先要找的就是它；
         放最前面，矮屏手机也不会被项目列表挤出第一屏。 */
      const _oh=el('div','fgroup fght');
      _oh.appendChild(setIcoText(el('span'),'folder-open','位置 ('+_top.length+')'));
      _oh.appendChild(ic(S.otherOpen?'caret':'caret-right','fgv'));
      _oh.onclick=()=>{ S.otherOpen=!S.otherOpen; renderFiles(v,{roots:roots, projects:projects}); };
      bodyc.appendChild(_oh);
      if(S.otherOpen) for(const rt of _top) bodyc.appendChild(_rowOf(rt,'folder-open'));
      if(projects.length) { const _g=el('div','fgroup'); _g.appendChild(setIcoText(el('span'),'pin','项目')); bodyc.appendChild(_g); }
      for(const p of projects){
        const row=el('div','frow');
        row.appendChild(ic('folder','fi'));
        row.appendChild(el('span','fn',p.name));
        row.appendChild(el('span','fs',(p.extra&&p.extra.length)?('+'+p.extra.length+' 关联'):''));
        row.onclick=()=>nav({name:'files', path:p.path||null,projectId:p.id, from:v.from});
        bodyc.appendChild(row);
      }
      if(_sub.length){
        const _sh=el('div','fgroup fght');
        _sh.appendChild(setIcoText(el('span'),'folder','子目录 ('+_sub.length+')'));
        _sh.appendChild(ic(S.subOpen?'caret':'caret-right','fgv'));
        _sh.onclick=()=>{ S.subOpen=!S.subOpen; renderFiles(v,{roots:roots, projects:projects}); };
        bodyc.appendChild(_sh);
        if(S.subOpen) for(const rt of _sub) bodyc.appendChild(_rowOf(rt,'folder-open'));
      }
      upb.style.display=(v.from==='chat')?'block':'none';
      upb.onclick=()=>back();
      v.__ino=null;
      if(pre) box.scrollTop=keepTop;
      return;
    }
    const ls=(pre&&pre.ls)?pre.ls:await api('/api/fs/list?path='+encodeURIComponent(v.path));
    if(loadVersion!==S.filesLoadVersion)return;
    FILES_SIG=filesSigList(ls);
    v.__ino=ls.ino||null;
    upb.style.display='block';
    upb.onclick=()=>{ if(ls.isRoot) nav({name:'files', path:null, from:v.from}); else if(ls.parent) nav({name:'files', path:ls.parent, from:v.from}); else back(); };
    nfb.style.display=S.viewonly?'none':'block';
    bodyc.innerHTML='';
    const projects=(pre&&pre.projects)||((await api('/api/projects')).projects)||[];
    if(loadVersion!==S.filesLoadVersion)return;
    S.projects=projects;S.projectsAt=Date.now();
    FILES_SIG+='|'+filesSigProjects(projects);
    if(S.projects && S.projects.length){
      const _cur=(ls.path||'').toLowerCase();
      const _proj=S.projects.find(p=>v.projectId?p.id===v.projectId:(p.rootPaths||[p.path]).some(root=>String(root).toLowerCase()===_cur));
      const _links=_proj?(_proj.rootPaths||[_proj.path]).filter(path=>String(path).toLowerCase()!==_cur):[];
      if(_proj && _links.length){
        { const _g=el('div','fgroup'); _g.appendChild(setIcoText(el('span'),'link','「'+_proj.name+'」的关联目录')); bodyc.appendChild(_g); }
        for(const path of _links){
          const ex={path,name:baseName(path)};
          const row=el('div','frow lkr');
          row.appendChild(ic('link','fi'));
          row.appendChild(el('span','fn',ex.name));
          row.appendChild(el('span','fs','关联'));
          row.onclick=()=>nav({name:'files', path:ex.path,projectId:_proj.id, from:v.from});
          bodyc.appendChild(row);
        }
      }
    }
    const items=ls.items||[];
    if(!items.length) bodyc.appendChild(el('div','center',eggOf('emptyFolder')||'（空文件夹）'));
    for(const it of items){
      const row=el('div','frow');
      row.appendChild(ic(fileIcon(it.name, it.dir),'fi'));
      row.appendChild(el('span','fn', it.name));
      row.appendChild(el('span','fs', (it.dir?'':fmtSize(it.size))));
      row.onclick=()=>{
        const sep=ls.path.includes('\\')? '\\':'/';
        const fp=(ls.path.replace(/[\\/]+$/,'')) + sep + it.name;
        if(it.dir) nav({name:'files', path:fp, from:v.from});
        else nav({name:'file', path:fp, from:v.from});
      };
      bodyc.appendChild(row);
    }
    if(pre) box.scrollTop=keepTop;
  }catch(e){
    bodyc.innerHTML='<div class="center">加载失败: '+esc(e.message)+'</div>';
    followDir(v);
  }
}

function mdCssUrls(css, cssPath){
  const base=mdDirOf(cssPath);
  return String(css||'').replace(/url\(\s*(['"]?)([^)'"\n]+)\1\s*\)/gi,function(m,q,u){
    if(/^(?:data:|https?:|\/\/|#)/i.test(u)) return m;
    const lp=mdJoinPath(u,base);
    if(!mdLocalPath(lp)) return m;
    return 'url("'+mdRawUrl(lp).replace(/"/g,'%22')+'")';
  });
}
async function mdHtmlPreview(html,filePath){
  const raw=String(html||'');
  let doc;
  try{ doc=new DOMParser().parseFromString(raw,'text/html'); }catch(e){ return raw; }
  if(!doc || !doc.documentElement) return raw;
  const base=mdDirOf(filePath);
  const local=function(ref){
    if(!ref) return '';
    const p=mdJoinPath(String(ref).trim(),base);
    return mdLocalPath(p);
  };
  doc.querySelectorAll('base').forEach(function(n){ n.remove(); });
  const rw=function(sel,attr){
    doc.querySelectorAll(sel).forEach(function(n){
      const v=n.getAttribute(attr); if(!v) return;
      const lp=local(v); if(lp) n.setAttribute(attr,mdRawUrl(lp));
    });
  };
  rw('img[src]','src'); rw('source[src]','src'); rw('video[src]','src'); rw('audio[src]','src'); rw('video[poster]','poster');
  doc.querySelectorAll('style').forEach(function(n){ n.textContent=mdCssUrls(n.textContent,filePath); });
  doc.querySelectorAll('[style]').forEach(function(n){ n.setAttribute('style',mdCssUrls(n.getAttribute('style')||'',filePath)); });
  doc.querySelectorAll('img[srcset],source[srcset]').forEach(function(n){
    const set=n.getAttribute('srcset'); if(!set) return;
    n.setAttribute('srcset',set.split(',').map(function(part){
      const bits=part.trim().split(/\s+/); const lp=local(bits.shift()||'');
      return lp? [mdRawUrl(lp)].concat(bits).join(' '): part.trim();
    }).join(', '));
  });
  for(const n of Array.from(doc.querySelectorAll('link[rel~="stylesheet"][href]'))){
    const lp=local(n.getAttribute('href')); if(!lp) continue;
    try{
      const r=await api('/api/fs/read?max=800000&path='+encodeURIComponent(lp));
      if(r.text!=null){ const st=doc.createElement('style'); if(n.media) st.media=n.media; st.textContent=mdCssUrls(r.text,lp); n.replaceWith(st); }
      else n.removeAttribute('href');
    }catch(e){ n.removeAttribute('href'); }
  }
  for(const n of Array.from(doc.querySelectorAll('script[src]'))){
    const lp=local(n.getAttribute('src')); if(!lp) continue;
    try{
      const r=await api('/api/fs/read?max=800000&path='+encodeURIComponent(lp));
      if(r.text!=null){
        const sc=doc.createElement('script');
        for(const a of ['type','async','defer','nomodule']){ if(n.hasAttribute(a)) sc.setAttribute(a,n.getAttribute(a)); }
        sc.textContent=r.text; n.replaceWith(sc);
      }else n.removeAttribute('src');
    }catch(e){ n.removeAttribute('src'); }
  }
  let head=doc.head;
  if(!head){ head=doc.createElement('head'); doc.documentElement.insertBefore(head,doc.documentElement.firstChild); }
  if(!doc.querySelector('meta[charset]')){ const m=doc.createElement('meta'); m.setAttribute('charset','utf-8'); head.insertBefore(m,head.firstChild); }
  if(!doc.querySelector('meta[name="viewport"]')){ const m=doc.createElement('meta'); m.setAttribute('name','viewport'); m.setAttribute('content','width=device-width,initial-scale=1'); head.appendChild(m); }
  return '<!DOCTYPE html>'+doc.documentElement.outerHTML;
}
let FILE_SIG=null;
async function renderFile(v, keep){
  const box=$('#fileView');
  const keepTop=box.scrollTop;
  const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<40;
  box.innerHTML='';
  const ext=(v.path.split('.').pop()||'').toLowerCase();
  const isMd=(ext==='md'||ext==='markdown'||ext==='mdx'||ext==='mdown'||ext==='mkd');
  const isHtml=(ext==='html'||ext==='htm');
  if(!v.__fileMode) v.__fileMode='preview';
  const bar=setWsBar({ico:'file', title: baseName(v.path), sub: v.path});
  if(isMd||isHtml){
    const preview=v.__fileMode!=='source';
    const mb=setIcoText(el('button',null),preview?'code':'file',preview?'源码':'预览');
    mb.title=preview?'查看原始源码':'回到渲染预览';
    mb.onclick=function(){ v.__fileMode=preview?'source':'preview'; renderFile(v,true); };
    bar.appendChild(mb);
  }
  const cp=setIcoText(el('button',null),'copy','复制'); cp.onclick=()=>copyText(v.path);
  const rfb=ic('refresh',null,'button');
  rfb.title='刷新';
  rfb.onclick=()=>renderFile(viewNow(), true);
  const dl=setIcoText(el('button',null),'link','新窗口');
  dl.onclick=()=>window.open(mdRawUrl(v.path),'_blank');
  bar.appendChild(cp); bar.appendChild(rfb); bar.appendChild(dl);
  const bodyc=el('div'); bodyc.id='fileBody';
  box.appendChild(bodyc);
  if(IMG_EXT[ext]){
    const img=document.createElement('img');
    img.src=mdRawUrl(v.path);
    img.onerror=()=>{ bodyc.innerHTML='<div class="center">图片加载失败</div>'; };
    img.onclick=()=>openImgOverlay(img.src);
    bodyc.appendChild(img);
    if(keep) box.scrollTop=keepTop;
    try{ const st=await api('/api/fs/stat?path='+encodeURIComponent(v.path)); FILE_SIG=(st.mtime||0)+':'+(st.size||0); v.__ino=st.ino||null; }catch(e){ FILE_SIG=null; }
    return;
  }
  bodyc.innerHTML='<div class="center"><span class="spin"></span>'+eggNc('loadFile','加载…')+'</div>';
  try{
    const readMax=(isMd||isHtml)?800000:200000;
    const r=await api('/api/fs/read?max='+readMax+'&path='+encodeURIComponent(v.path));
    FILE_SIG=(r.mtime||0)+':'+(r.size||0);
    v.__ino=r.ino||null;
    bodyc.innerHTML='';
    if(r.image){ const img=document.createElement('img'); img.src=mdRawUrl(v.path); bodyc.appendChild(img); }
    else if(r.binary){ bodyc.appendChild(el('div','center','二进制文件（'+fmtSize(r.size)+'），点右上「新窗口」查看')); }
    else if(isMd && v.__fileMode!=='source'){
      const d=el('div','msg agent md filemd');
      d.innerHTML=md(r.text||'',mdDirOf(v.path));
      bodyc.appendChild(d);
    }
    else if(isHtml && v.__fileMode!=='source'){
      const fr=document.createElement('iframe');
      fr.className='fileHtml';
      fr.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-modals');
      fr.setAttribute('referrerpolicy','no-referrer');
      fr.title=baseName(v.path);
      fr.srcdoc=await mdHtmlPreview(r.text||'',v.path);
      bodyc.appendChild(fr);
    }
    else{
      bodyc.appendChild(el('pre',null, r.text||''));
    }
    if(r.truncated) bodyc.appendChild(el('div','center','（文件较大，仅显示前 '+Math.round(readMax/1024)+'KB，共 '+fmtSize(r.size)+'）'));
    if(keep) box.scrollTop=atBottom? box.scrollHeight : keepTop;
  }catch(e){ bodyc.innerHTML='<div class="center">读取失败: '+esc(e.message)+'</div>'; followFile(v); }
}

/* ===== 开机启动页 BOOT v1（徽标飞入左上角） ===== */
const BOOT={t0:Date.now(),ws:false,list:false,note:0,noteT:0,started:false,out:false,done:false,min:0,max:1100,seqT:null,quiet:null};
/* 开机动画最短重现间隔：8h 内不重复播；超过 8h（或版本更新）会重播一次 */
const BOOT_TTL=8*3600*1000;
let _bootSayLast='';
function bootSay(text, anim){

function bootDone(kind){ try{ if(kind==='ws') BOOT.ws=true; else if(kind==='list') BOOT.list=true; bootSeqPaint(); }catch(e){} bootMaybeOut(); }
function bootQuiet(){
  /* 开机首屏要渲染会话列表/历史，会抛 50~80ms 长任务；起飞前先等它静下来，飞行才不掉帧 */
  if(BOOT.quiet!==null) return;
  try{
    if(typeof PerformanceObserver==='undefined'){ BOOT.quiet=false; return; }
    const q={last:0,po:null};
    const po=new PerformanceObserver(function(l){
      try{ const es=l.getEntries(); for(let i=0;i<es.length;i++){ const e=es[i]; if(e.startTime+e.duration>q.last) q.last=e.startTime+e.duration; } }catch(e2){}
    });
    try{ po.observe({type:'longtask',buffered:true}); }
    catch(e2){ po.observe({entryTypes:['longtask']}); }
    q.po=po; BOOT.quiet=q;
  }catch(e){ BOOT.quiet=false; }
}
function bootQuietLeft(){
  const q=BOOT.quiet;
  if(!q) return 0;
  const left=q.last+200-performance.now();
  return left>0?left:0;
}
function bootIdleGo(){
  /* 关键：绝不在长任务里起飞。实测在列表渲染的 86ms 长任务中起飞，动画首帧被顶掉 80ms。
     改到 requestIdleCallback 里动手——主线程忙时它会自动等，最多等 300ms 兜底。 */
  if(BOOT.done||BOOT.out) return;
  let fired=false, t=0;
  const once=function(){ if(fired) return; fired=true; try{ clearTimeout(t); }catch(e){} if(!BOOT.done&&!BOOT.out) bootFly(); };
  t=setTimeout(function(){ if(!fired){ fired=true; if(!BOOT.done&&!BOOT.out) bootFly(); } },300);
  try{
    if(typeof window.requestIdleCallback==='function') window.requestIdleCallback(function(){ once(); },{timeout:280});
    else once();
  }catch(e){ once(); }
}
function bootMaybeOut(){
  if(BOOT.done||BOOT.out||!BOOT.started) return;
  const el=Date.now()-BOOT.t0;
  if(el>=BOOT.max){ bootFly(); return; }
  if(BOOT.ws&&BOOT.list){
    if(el<BOOT.min){ setTimeout(bootMaybeOut,BOOT.min-el+8); return; }
    /* 安静窗口：最近 200ms 内没有长任务，再进空闲回调起飞 */
    const left=fxReduced()?0:bootQuietLeft();
    if(left>0 && el<BOOT.max-420){ setTimeout(bootMaybeOut,Math.min(left+16,120)); return; }
    if(fxReduced()) bootFly(); else bootIdleGo();
  }
}

/* 飞行拖尾引擎：光迹 + 双拖影。

   等价于 --mb 多子帧叠加出的残影，但只用合成层，零逐帧开销。 */
function bootTrail(B,lock,geo){
  try{
    if(fxReduced()) return;
    const dx=geo.dx, dy=geo.dy, sc=geo.s;
    const LEN=Math.sqrt((geo.ex-geo.sx)*(geo.ex-geo.sx)+(geo.ey-geo.sy)*(geo.ey-geo.sy));
    if(!(LEN>24)) return;
    const ang=(Math.atan2(geo.ey-geo.sy,geo.ex-geo.sx)*180/Math.PI).toFixed(2);
    /* 光迹：沿真实起终点连线扫过 */
    try{
      const st=el('div','bt-streak');
      const seg=LEN*0.28;
      st.style.left=geo.sx.toFixed(1)+'px'; st.style.top=(geo.sy-1).toFixed(1)+'px';
      st.style.width=seg.toFixed(1)+'px';
      st.style.transform='rotate('+ang+'deg) translateX(0px) scaleX(.35)';
      B.appendChild(st);
      requestAnimationFrame(function(){
      st.style.transition='transform .46s cubic-bezier(.3,.7,.3,1),opacity .26s ease';
        st.style.transform='rotate('+ang+'deg) translateX('+(LEN-seg).toFixed(1)+'px) scaleX(1)';
        st.style.opacity='.82';
        setTimeout(function(){ st.style.opacity='0'; },80);
      });
      setTimeout(function(){ try{ st.remove(); }catch(e){} },1250);
    }catch(e){}
    /* 拖影：不再复制整枚 lockup。复制品会带着 AGENT/NEXUS 小字，
       飞行时看起来像两个 Logo 叠在一起；只保留上面的光迹。 */
    const ghosts=[];
    for(let i=0;i<ghosts.length;i++){
      (function(G){
        let g=null;
        try{
          g=lock.cloneNode(true);
          g.removeAttribute('id');
          const strip=g.querySelectorAll('[id]');
          for(let k=0;k<strip.length;k++) strip[k].removeAttribute('id');
          g.className=String(lock.className||'').replace(/\s*fly\b/g,'').trim()+' bt-ghost';
          g.style.left=geo.a.left.toFixed(1)+'px';
          g.style.top=geo.a.top.toFixed(1)+'px';
          g.style.opacity=String(G.o);
          g.style.transition='none';
          g.style.transform='none';
          B.appendChild(g);
          requestAnimationFrame(function(){
            g.style.transition='transform .52s cubic-bezier(.22,1,.36,1) '+G.lag+'ms,opacity .26s linear '+(130+G.lag)+'ms';
            g.style.transform='translate('+dx.toFixed(2)+'px,'+dy.toFixed(2)+'px) scale('+(sc*G.k).toFixed(5)+')';
            g.style.opacity='0';
          });
        }catch(e){}
        setTimeout(function(){ try{ if(g) g.remove(); }catch(e){} },1000);
      })(ghosts[i]);
    }
    lock.classList.add('fly');
  }catch(e){}
}
/* ===== AN10：收束版 =====
   三颗节点依次苏醒，光弧接力；最后不做齐跳，而是错峰向中心收拢成一簇，
   由中心升起一束光点亮 Nexus，再交接到顶栏。 */
const AN10_LEGACY=(function(){
  const APPEAR=[0.08,0.16,0.24];
  const LIGHT =[0.40,0.78,1.16];
  /* 单球接力跳已关闭；时间推到同步跃迁之后，仅保留数组兼容既有渲染分支。 */
  const PRESS =[9.00,9.00,9.00];
  const LAUNCH=[9.10,9.10,9.10];
  const AIR   =[0.50,0.50,0.50];
  const BEAM  =[[0.46,0.28],[0.84,0.28]];
  const BREATH_START=1.10;
  const FINAL_MIN=1.46, FINAL_PRESS=0.08, FINAL_AIR=0.40, FINAL_HOLD=0.16;
  const GATHER_STAGGER=[0.00,0.030,0.060];
  const GATHER_DUR=0.34;
  const BASE_EVENTS=[
    [0.08,'三枚小核，各自醒来。'],
    [0.46,'第一束光，抵达。'],
    [0.84,'接住了。'],
    [1.16,'同一个频率。']
  ].map(function(e){ return {t:e[0],s:e[1]}; });

  let B=null, stage=null, lanes=[], balls=[], shadows=[], ripples=[], beams=[], sparks=[];
  let rise=null, riseHead=null, glowEl=null;
  let flash=null, shock=null, halo=null;
  let ribbonsEl=null, ribbonHalos=[], ribbonCores=[], comets=[], arcs=[];
  let lightTheme=false;
  let running=false, raf=0, activeAt=0, lastT=0;
  let finalAt=-1, finalCb=null, finalDone=false;
  let eventCb=null, events=BASE_EVENTS.slice(), evIdx=0;
  const geom={ready:false,hops:[70,78,74],slam:[82,88,84],dist:[104,104],b:36,remeasured:false,stageLive:false};

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function smooth(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
  function easeOutCubic(x){ x=clamp(x,0,1); return 1-Math.pow(1-x,3); }
  function easeInOutCubic(x){ x=clamp(x,0,1); return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }
  function easeOutBack(x){ x=clamp(x,0,1); const c=1.70158, u=x-1; return 1+(c+1)*u*u*u+c*u*u; }

  function init(){
    B=$('#boot'); stage=$('#btStage');
    if(!B||!stage) return false;
    lanes=Array.prototype.slice.call(stage.querySelectorAll('.an10-lane'));
    balls=[]; shadows=[]; ripples=[]; beams=[]; sparks=[];
    for(let i=0;i<lanes.length;i++){
      balls.push(lanes[i].querySelector('.an10-ball'));
      shadows.push(lanes[i].querySelector('.an10-shadow'));
      ripples.push(lanes[i].querySelector('.an10-ripple'));
      beams.push(lanes[i].querySelector('.an10-beam'));
      sparks.push(lanes[i].querySelector('.an10-spark'));
    }
    flash=stage.querySelector('.an10-flash');
    shock=stage.querySelector('.an10-shock');
    halo=stage.querySelector('.an10-halo');
    rise=stage.querySelector('.an10-rise');
    riseHead=stage.querySelector('.an10-rise-head');
    glowEl=B?B.querySelector('.bt-glow'):null;
    ribbonsEl=stage.querySelector('.an10-ribbons');
    ribbonHalos=[]; ribbonCores=[]; comets=[];
    try{ lightTheme=document.documentElement.classList.contains('light'); }catch(e){ lightTheme=false; }
    if(ribbonsEl){
      const rg=ribbonsEl.querySelectorAll('g[data-i]');
      for(let i=0;i<rg.length;i++){
        ribbonHalos.push(rg[i].querySelector('.an10-ribbon.halo'));
        ribbonCores.push(rg[i].querySelector('.an10-ribbon.core'));
        comets.push(rg[i].querySelectorAll('.an10-comet'));
      }
    }
    if(balls.length!==3||!balls[0]||!balls[1]||!balls[2]||!flash||!shock) return false;
    if(!geom.ready) measure();
    return true;
  }

  /* 现场量安全区：球顶到 ABSEN NEXUS 字标底部至少留 22px，
     小屏、横屏也不会把字标撞穿。 */
  function measure(){
    if(!B||!stage||!lanes.length||!balls[0]) return;
    const lock=$('#btLock');
    const r0=lanes[0].getBoundingClientRect();
    const ballSize=lanes[0].offsetWidth||r0.width||30;
    const ground=r0.bottom;
    const lockBottom=lock?lock.getBoundingClientRect().bottom:0;
    const safe=Math.max(ballSize*1.5,ground-lockBottom-22-ballSize);
    const cap=Math.min(ballSize*2.85,safe);
    geom.b=ballSize;
    geom.hops=[ballSize,ballSize,ballSize];
    /* 最终不再齐跳：三颗向中心收束成一簇，再由中心拉起一束光。 */
    geom.slam=[0,0,0];
    const centers=[];
    for(let i=0;i<lanes.length;i++){
      centers.push(lanes[i].offsetLeft+lanes[i].offsetWidth/2);
    }
    const stageW=stage.clientWidth||Math.round(stage.getBoundingClientRect().width)||1;
    const stageH=stage.clientHeight||Math.round(stage.getBoundingClientRect().height)||1;
    const mid=stageW/2;
    const compact=ballSize*1.03;
    const targets=[mid-compact,mid,mid+compact];
    geom.gather=[targets[0]-centers[0],targets[1]-centers[1],targets[2]-centers[2]];
    geom.dist=[Math.max(1,centers[1]-centers[0]),Math.max(1,centers[2]-centers[1])];
    for(let j=0;j<2;j++){
      if(beams[j]){
        beams[j].style.left=(ballSize*.5).toFixed(2)+'px';
        beams[j].style.width=geom.dist[j].toFixed(2)+'px';
      }
    }
    /* 弧光全部用 stage 局部坐标；viewBox 与 client 尺寸 1:1，避免 DPR/缩放误差。 */
    const lockRect=lock?lock.getBoundingClientRect():null;
    const stageRect=stage.getBoundingClientRect();
    const riseBottom=stageRect.top+stageH-ballSize*.66;
    geom.riseH=lockRect?Math.max(ballSize*1.5,riseBottom-lockRect.bottom-4):ballSize*7;
    if(rise) rise.style.setProperty('--riseH',geom.riseH.toFixed(2)+'px');
    if(ribbonsEl){
      ribbonsEl.setAttribute('viewBox','0 0 '+stageW+' '+stageH);
      ribbonsEl.setAttribute('width','100%');
      ribbonsEl.setAttribute('height','100%');
    }
    const y0=lanes[0].offsetTop+lanes[0].offsetHeight/2;
    const y1=lanes[1].offsetTop+lanes[1].offsetHeight/2;
    arcs=[];
    for(let j=0;j<2;j++){
      const x0=centers[j], x1=centers[j+1];
      const cx=(x0+x1)/2;
      const cy=Math.min(y0,y1)-ballSize*2.46;
      arcs.push({x0:x0,y0:y0,cx:cx,cy:cy,x1:x1,y1:y1});
      const d='M '+x0.toFixed(2)+' '+y0.toFixed(2)+' Q '+cx.toFixed(2)+' '+cy.toFixed(2)+' '+x1.toFixed(2)+' '+y1.toFixed(2);
      if(ribbonCores[j]) ribbonCores[j].setAttribute('d',d);
      if(ribbonHalos[j]) ribbonHalos[j].setAttribute('d',d);
      if(comets[j]){
        for(let k=0;k<comets[j].length;k++){
          comets[j][k].setAttribute('r',Math.max(1.6,ballSize*(k ? 0.055 : 0.095)).toFixed(2));
        }
      }
    }
    geom.ready=true;
  }

  function liveStage(){
    if(!stage||geom.stageLive) return;
    geom.stageLive=true;
    stage.style.animation='none';
    stage.style.opacity='1';
  }

  function runEvents(t){
    if(!events.length) return;
    let latest='';
    while(evIdx<events.length&&t>=events[evIdx].t){ latest=events[evIdx].s; evIdx++; }
    if(latest&&eventCb){ try{ eventCb(latest); }catch(e){} }
  }

  /* 空中：真抛物线 + 起跳瞬间释放形变，速度越快拉伸越轻。 */
  function airState(hops,u,baseSx,baseSy,stretchX,stretchY){
    const hole=4*hops*u*(1-u);
    const push=easeOutCubic(clamp(u/.16,0,1));
    const speed=Math.abs(1-2*u);
    return {
      hole:hole,
      sx:lerp(baseSx,1-stretchX*speed,push),
      sy:lerp(baseSy,1+stretchY*speed,push)
    };
  }

  /* 落地：从触地前姿态连续过渡到指数衰减余弦余振，不硬切。 */
  function settleState(v,fromSx,fromSy,ampX,ampY){
    const k=smooth(clamp(v/.032,0,1));
    const sp=Math.exp(-9.6*v)*Math.cos(17.5*v);
    return {sx:lerp(fromSx,1+ampX*sp,k),sy:lerp(fromSy,1-ampY*sp,k)};
  }

  function render(t){
    if(!stage) return;
    if(t>=0.52&&!geom.remeasured){ liveStage(); measure(); geom.remeasured=true; }

    const finalLand=Infinity;
    const breathOn=t>=BREATH_START&&(finalAt<0||t<finalAt);
    const breathPhase=(t-BREATH_START)*Math.PI*2*.92;
    const breath=breathOn?Math.sin(breathPhase):0;
    /* 光弧飞行后 56% 起，下一颗先“感到”能量，轻轻鼓起——但还没点亮。 */
    const incoming=[0,0,0];
    for(let j=0;j<2;j++){
      const p=(t-BEAM[j][0])/BEAM[j][1];
      if(p>.56&&p<1){
        const q=smooth(clamp((p-.56)/.44,0,1));
        if(q>incoming[j+1]) incoming[j+1]=q;
      }
    }

    for(let i=0;i<3;i++){
      const ap=clamp((t-APPEAR[i])/.24,0,1);
      const as=.70+.30*easeOutBack(ap);
      const op=clamp(ap/.62,0,1);
      let hole=0,sx=1,sy=1,press=0,tx=0;
      const land=LAUNCH[i]+AIR[i];
      const wake=t-LIGHT[i];
      const lit=wake>=0;

      if(finalAt>=0&&t>=finalAt){
        const ft=t-finalAt;
        const tension=easeInOutCubic(clamp(ft/FINAL_PRESS,0,1));
        const gStart=FINAL_PRESS*.28+GATHER_STAGGER[i];
        const gq=easeInOutCubic(clamp((ft-gStart)/GATHER_DUR,0,1));
        const gs=Math.sin(Math.PI*gq);
        press=.38*tension;
        tx=(geom.gather&&isFinite(geom.gather[i]))?geom.gather[i]*gq:0;
        sx=1-.018*gs;
        sy=1+.012*gs;
      }else if(t<PRESS[i]){
        /* 在地面待命，不随机晃。 */
      }else if(t<LAUNCH[i]){
        const q=easeInOutCubic((t-PRESS[i])/(LAUNCH[i]-PRESS[i]));
        press=q; sx=1+.095*q; sy=1-.12*q;
      }else if(t<land){
        const u=clamp((t-LAUNCH[i])/AIR[i],0,1);
        const st=airState(geom.hops[i],u,1.095,.88,.024,.044);
        hole=st.hole; sx=st.sx; sy=st.sy;
      }else{
        const v=t-land;
        const st=settleState(v,1-.024,1+.044,.112,.132);
        sx=st.sx; sy=st.sy;
      }

      const pre=incoming[i];
      if(pre>0&&!lit){ sx+=.016*pre; sy+=.016*pre; }
      if(breathOn){
        const br=Math.sin(breathPhase+i*.82)*(i===1?1:.86);
        sx+=.006*br; sy-=.006*br;
      }

      const wakeIn=smooth(clamp(wake/.24,0,1));
      const wakePulse=lit?Math.exp(-Math.max(0,wake)/.42)*smooth(clamp(wake/.055,0,1)):0;
      balls[i].style.opacity=(op*(lit?1:(.56+.10*pre))).toFixed(3);
      balls[i].style.filter='saturate('+(lit?1:(.55+.15*pre)).toFixed(3)+') brightness('+(lit?1+.18*wakePulse:(.84+.08*pre)).toFixed(3)+')';
      balls[i].style.transform='translate3d('+tx.toFixed(2)+'px,'+(-hole).toFixed(2)+'px,0) scale('+(sx*as).toFixed(4)+','+(sy*as).toFixed(4)+')';

      const af=clamp(hole/Math.max(1,geom.slam[i]),0,1);
      shadows[i].style.opacity=(op*(.42*(1-.66*af)+.14*press)).toFixed(3);
      shadows[i].style.transform='translateX(-50%) translateX('+tx.toFixed(2)+'px) scale('+(1.05-.30*af+.13*press).toFixed(3)+','+(.94-.18*af+.06*press).toFixed(3)+')';

      const landTime=finalAt>=0?finalLand:land;
      const wakeR=(t-LIGHT[i])/.34;
      const landR=(t-landTime)/.42;
      if(wakeR>=0&&wakeR<1){
        const e=easeOutCubic(wakeR);
        ripples[i].style.opacity=(op*(1-wakeR)*(1-wakeR)*.52).toFixed(3);
        ripples[i].style.transform='translate(-50%,50%) scale('+(.44+.86*e).toFixed(3)+','+(.48+.38*wakeR).toFixed(3)+')';
      }else if(landR>=0&&landR<1){

    if(j && j.role==='view'){ S.viewonly=true; document.body.classList.add('viewonly'); }
  }).catch(()=>{});
  setInterval(()=>{ if((S.wide || viewNow().name==='list') && !document.hidden){ loadThreads(true); } },30000);
  setInterval(runTick,8000);
  setInterval(resyncLight,6000);
  setInterval(filesTick,3000);
  setInterval(fileTick,3000);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ _stashAtBottom(); } else { wakeSync(); uiTick(); reseatBottom(); } });
  window.addEventListener('pagehide',()=>{ _stashAtBottom(); });
  window.addEventListener('pageshow',()=>{ wakeSync(); setTimeout(reseatBottom,60); });
  window.addEventListener('online',()=>wakeSync());
}

<script>
(function setupSidebarResize(){
  const key='an.sidebar.width';
  const root=document.documentElement;
  const handle=document.createElement('div');handle.id='sidebarResize';handle.tabIndex=0;
  handle.setAttribute('role','separator');handle.setAttribute('aria-orientation','vertical');
  handle.setAttribute('aria-label','调整会话侧栏宽度');handle.title='拖动调整宽度；双击恢复默认';
  document.body.appendChild(handle);
  let width=300;
  try{const saved=Number(localStorage.getItem(key));if(saved>=240)width=saved;}catch(e){}
  function apply(value,save){
    const maximum=window.innerWidth<720?640:Math.max(240,Math.min(640,window.innerWidth-360));
    width=Math.round(Math.max(240,Math.min(maximum,value)));
    root.style.setProperty('--sidebar-width',width+'px');
    const top=document.querySelector('#top');root.style.setProperty('--sidebar-top',(top?top.getBoundingClientRect().bottom:60)+'px');
    handle.hidden=window.innerWidth<720;
    handle.setAttribute('aria-valuemin','240');handle.setAttribute('aria-valuemax',String(maximum));handle.setAttribute('aria-valuenow',String(width));
    if(save)try{localStorage.setItem(key,String(width));}catch(e){}
  }
  handle.addEventListener('pointerdown',function(event){
    if(event.button!==0)return;event.preventDefault();handle.setPointerCapture(event.pointerId);document.body.classList.add('sidebarResizing');
  });
  handle.addEventListener('pointermove',function(event){if(handle.hasPointerCapture(event.pointerId))apply(event.clientX,false);});
  function finish(event){if(handle.hasPointerCapture(event.pointerId))handle.releasePointerCapture(event.pointerId);document.body.classList.remove('sidebarResizing');apply(width,true);}
  handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);
  handle.addEventListener('dblclick',function(){apply(300,true);});
  handle.addEventListener('keydown',function(event){if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();apply(width+(event.key==='ArrowRight'?20:-20),true);}else if(event.key==='Home'){event.preventDefault();apply(300,true);}});
  window.addEventListener('resize',function(){apply(width,false);});apply(width,false);
})();
</script>
