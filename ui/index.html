#runBar{display:none;align-items:center;gap:8px;padding:8px 2px;background:transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);flex:none}

/* ===== 开机启动页 BOOT v1：AN 徽标 → 丝滑飞入左上角 ===== */
#boot{--btT:min(94px,calc((100vw - 56px)/4.615385));position:fixed;left:0;top:0;right:0;bottom:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#boot .bt-bg{position:absolute;left:0;top:0;right:0;bottom:0;background:#0a0a0a;pointer-events:none;will-change:opacity}
html.light #boot .bt-bg{background:#fff}
html.nosplash #boot{display:none!important}
#boot .bt-glow{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,18,.28) 0%,rgba(255,190,86,.11) 42%,rgba(10,10,10,0) 70%);opacity:0;pointer-events:none;will-change:transform,opacity}
html.light #boot .bt-glow{background:radial-gradient(circle,rgba(255,106,0,.17) 0%,rgba(246,197,107,.09) 42%,rgba(255,255,255,0) 70%)}
#boot .bt-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(var(--btT)*.36)}
/* lockup = 顶栏 #logo + #brandName 的精确等比放大：比例锚点 26px = 1 单位，
   所以飞到左上角时纯缩放平移即可严丝合缝落到顶栏徽标上（24px 内不再有第二套几何） */
#boot .bt-lock{position:relative;display:flex;align-items:center;gap:calc(var(--btT)*.307692);transform-origin:0 0;will-change:transform;backface-visibility:hidden}
#boot .bt-tile{position:relative;flex:none;width:var(--btT);height:var(--btT);border-radius:calc(var(--btT)*.307692);border:1px solid rgba(255,226,166,.38);background:radial-gradient(125% 115% at 18% 8%,rgba(255,255,255,.55) 0%,rgba(255,244,214,.20) 24%,rgba(255,255,255,0) 52%),radial-gradient(80% 70% at 82% 92%,rgba(255,196,92,.34) 0%,rgba(255,106,0,0) 62%),linear-gradient(145deg,#FFD27A 0%,#FFAD3D 18%,#FF7A12 58%,#E24600 100%);box-shadow:inset 0 0 0 calc(var(--btT)*.038462) rgba(255,226,166,.42),inset 0 calc(var(--btT)*.038462) calc(var(--btT)*.076923) rgba(255,255,255,.18),inset 0 calc(var(--btT)*-.115385) calc(var(--btT)*.230769) rgba(118,35,0,.20),0 calc(var(--btT)*.076923) calc(var(--btT)*.384615) rgba(255,106,0,.30),0 0 calc(var(--btT)*.615385) rgba(255,184,77,.12);display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;transform:scale(.6);transform-origin:50% 50%;will-change:transform,opacity;backface-visibility:hidden}
#boot .bt-tile svg{display:block;width:73.077%;height:73.077%;overflow:visible}
#boot .bt-tile svg .lp-p{fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100}
#boot .bt-tile svg .lp-n{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center}
#boot .bt-tile svg .lp-c{fill:#38bdf8;filter:drop-shadow(0 0 3px rgba(56,189,248,1))}
#boot .bt-tile svg .lp-t{fill:rgba(125,211,252,.30);filter:drop-shadow(0 0 3px rgba(56,189,248,.75))}
#boot .bt-tile svg .lp-c,#boot .bt-tile svg .lp-t{opacity:0}
#boot .bt-tile::after{content:'';position:absolute;left:-34%;top:-34%;width:168%;height:168%;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.30) 34deg,rgba(255,255,255,0) 78deg,rgba(186,230,253,.24) 198deg,rgba(255,255,255,0) 240deg);mix-blend-mode:screen;opacity:0;pointer-events:none;will-change:transform,opacity;animation:btOrbitSpin 3.1s linear .86s infinite,btOrbitFade .52s ease .86s forwards}
/* 光弧巡航：连续旋转 = 元素身份连续（源：06-morph 的思路，不做硬切） */
@keyframes btOrbitSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes btOrbitFade{from{opacity:0}to{opacity:.55}}
/* v4 扫描显影：高斯亮线自上而下扫过磁贴，扫过处被点亮（源：20-blueprint 扫描线 + 前沿辉光） */
#boot .bt-tile::before{content:'';position:absolute;left:-8%;right:-8%;top:0;height:30%;pointer-events:none;opacity:0;mix-blend-mode:screen;background:linear-gradient(180deg,rgba(186,230,253,0) 0%,rgba(186,230,253,.16) 36%,rgba(244,251,255,.95) 50%,rgba(186,230,253,.16) 64%,rgba(186,230,253,0) 100%);filter:blur(.5px) drop-shadow(0 0 7px rgba(165,220,255,.85));transform:translateY(-160%);will-change:transform,opacity;animation:btScan .48s cubic-bezier(.42,.02,.3,1) .40s both}
@keyframes btScan{0%{opacity:0;transform:translateY(-160%)}8%{opacity:1}78%{opacity:1}100%{opacity:0;transform:translateY(530%)}}
/* v5 磁贴充能：墨滴落点修正 —— 光不再从屏幕中心荡开，而是从磁贴本体发出（源：18-ink 一滴墨荡开 + 20-blueprint 扫过处被点亮） */
#boot .bt-lock::before,#boot .bt-lock::after{content:'';position:absolute;left:0;top:calc(50% - var(--btT)/2);width:var(--btT);height:var(--btT);border-radius:calc(var(--btT)*.307692);pointer-events:none;opacity:0;will-change:transform,opacity}

@keyframes btCharge{0%{opacity:0;transform:scale(.74)}28%{opacity:.88;transform:scale(1.04)}100%{opacity:0;transform:scale(1.42)}}


#boot .bt-sheen{position:absolute;left:-70%;top:-40%;width:52%;height:180%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));opacity:0;pointer-events:none;transform:rotate(18deg);will-change:transform,opacity}
#boot .bt-word{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--btT)*.076923);min-width:0}
#boot .bt-t1{font-family:Bahnschrift,'Bahnschrift SemiBold','Segoe UI Variable Display','SF Pro Display',-apple-system,BlinkMacSystemFont,'PingFang SC',system-ui,sans-serif;font-size:calc(var(--btT)*.365385);font-weight:700;line-height:1;letter-spacing:.48em;text-indent:.52em;color:#8f9bf0;opacity:1}
#boot .bt-t2{display:block;width:calc(var(--btT)*3.307692);height:calc(var(--btT)*.769231);overflow:visible;opacity:0}

#boot .bt-rest{display:flex;flex-direction:column;align-items:center;will-change:transform,opacity}
/* 三颗弹跳小球：蹬地压缩 -> 上升减速 -> 加速下落 -> 触地 squash -> 阻尼余振
   技法源：video-production/sy-styles-20 §4.5「07-sticker 落地三段」+ style-agent-os §十 物理耦合
   三球共用同一关键帧，只错开 delay 形成波；影子随球高反相（高=小淡，触地=大实） */
#boot .bt-balls{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:16px;width:160px;height:4px;opacity:0}
#boot .bt-balls>i{position:relative;flex:none;width:18px;height:4px}

#boot .bt-balls>i>b{position:absolute;left:50%;bottom:-3px;width:32px;height:9px;margin-left:-16px;border-radius:50%;transform-origin:50% 50%;pointer-events:none;will-change:transform,opacity;background:radial-gradient(50% 50% at 50% 50%,rgba(165,180,252,.55) 0%,rgba(125,211,252,.22) 46%,rgba(125,211,252,0) 74%);filter:blur(1.6px)}

#boot .bt-balls>i:nth-child(2)>span{background:radial-gradient(120% 120% at 30% 22%,#eef2ff 0%,#c7d2fe 32%,#6366f1 100%);box-shadow:0 0 9px rgba(99,102,241,.55),0 0 20px rgba(99,102,241,.20)}
#boot .bt-balls>i:nth-child(3)>span{background:radial-gradient(120% 120% at 30% 22%,#f0f9ff 0%,#bae6fd 32%,#0ea5e9 100%);box-shadow:0 0 9px rgba(14,165,233,.55),0 0 20px rgba(14,165,233,.20)}

/* ===== AN_BOOT_STORY_V9: 能量接力（左球落地 = 中球受压接棒） =====
   设计约束：
   - 三个球不是各跳各的，而是一条从左到右的能量链；
   - 上一球在 84% 触地，下一球在 34ms 前已开始压缩 -> 冲击有因果；
   - 每次触地：地面椭圆冲击环 + 向右的短光束 + 影子同步压扁；
   - 三球收尾后先做一次很轻的同步呼吸，留 0.7s 让用户看清 lockup；
   - 最后一跳 1.70s，落地后 flash / 三环 / 冲击线保留 650ms 再交棒。
   - 动画只用 transform / opacity；轨道扫光是一根 2px 线，避免在 iPad 上掉帧。 */

/* 小球组入场：慢一点、不要突然弹出来 */
#boot .bt-balls{animation:an9Rise .88s cubic-bezier(.22,1,.36,1) .50s both!important;gap:clamp(18px,calc(var(--btT)*.34),32px)}
#boot .bt-note{animation:an9RiseNote .62s cubic-bezier(.22,1.16,.36,1) .92s both;color:rgba(203,210,232,.82)}
html.light #boot .bt-note{color:#64748b}
@keyframes an9Rise{0%{opacity:0;transform:translateY(13px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes an9RiseNote{0%{opacity:0;transform:translateY(7px);filter:blur(3px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}

/* 地面能量轨：一条很淡的线，加一颗从左向右的过轨光点 */
#boot .bt-track{position:absolute;left:0;right:0;bottom:calc(var(--btB)*-.34);height:2px;border-radius:999px;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(124,58,237,0),rgba(139,92,246,.24) 12%,rgba(125,211,252,.52) 50%,rgba(139,92,246,.24) 88%,rgba(124,58,237,0));box-shadow:0 0 12px rgba(99,102,241,.32);animation:an9TrackIn 1.0s ease .74s both}
#boot .bt-track::after{content:'';position:absolute;top:50%;left:12%;width:calc(var(--btB)*.90);height:calc(var(--btB)*.90);margin:calc(var(--btB)*-.45) 0 0 calc(var(--btB)*-.45);border-radius:50%;background:radial-gradient(circle,rgba(236,254,255,.95) 0%,rgba(125,211,252,.58) 28%,rgba(99,102,241,.20) 54%,rgba(99,102,241,0) 72%);filter:blur(1.1px);opacity:0;will-change:left,opacity;animation:an9Spark 2.5s cubic-bezier(.4,0,.2,1) .95s both}
html.light #boot .bt-track{background:linear-gradient(90deg,rgba(79,70,229,0),rgba(79,70,229,.14) 12%,rgba(14,165,233,.30) 50%,rgba(79,70,229,.14) 88%,rgba(79,70,229,0));box-shadow:0 0 10px rgba(79,70,229,.16)}
@keyframes an9TrackIn{0%{opacity:0;transform:scaleX(.55)}100%{opacity:1;transform:scaleX(1)}}
@keyframes an9Spark{0%{left:12%;opacity:0}3%{opacity:1}34%{left:50%}72%{left:86%}84%{opacity:.9}100%{left:86%;opacity:0}}

/* 三球：左 -> 中 -> 右，后一球在前一球触地前 34ms 受压 */
#boot .bt-balls>i{--hop:calc(var(--btB)*-2.25);--slamHop:calc(var(--btB)*-3.30)}
#boot .bt-balls>i:nth-child(2){--hop:calc(var(--btB)*-2.80);--slamHop:calc(var(--btB)*-3.62)}
#boot .bt-balls>i:nth-child(3){--hop:calc(var(--btB)*-3.15);--slamHop:calc(var(--btB)*-3.38)}
#boot .bt-balls>i:nth-child(1)>span{animation:an9RelayBall 1.10s cubic-bezier(.18,.78,.24,1) .95s both,an9TeamBall .78s cubic-bezier(.22,.82,.30,1) 3.95s forwards!important}
#boot .bt-balls>i:nth-child(1)>b{animation:an9RelayShadow 1.10s cubic-bezier(.18,.78,.24,1) .95s both,an9TeamShadow .78s cubic-bezier(.22,.82,.30,1) 3.95s forwards!important}
#boot .bt-balls>i:nth-child(2)>span{animation:an9RelayBall 1.10s cubic-bezier(.18,.78,.24,1) 1.84s both,an9TeamBall .78s cubic-bezier(.22,.82,.30,1) 3.95s forwards!important}
#boot .bt-balls>i:nth-child(2)>b{animation:an9RelayShadow 1.10s cubic-bezier(.18,.78,.24,1) 1.84s both,an9TeamShadow .78s cubic-bezier(.22,.82,.30,1) 3.95s forwards!important}
#boot .bt-balls>i:nth-child(3)>span{animation:an9RelayBall 1.10s cubic-bezier(.18,.78,.24,1) 2.73s both,an9TeamBall .78s cubic-bezier(.22,.82,.30,1) 3.95s forwards!important}
#boot .bt-balls>i:nth-child(3)>b{animation:an9RelayShadow 1.10s cubic-bezier(.18,.78,.24,1) 2.73s both,an9TeamShadow .78s cubic-bezier(.22,.82,.30,1) 3.95s forwards!important}

#boot .bt-balls>i::before{content:'';position:absolute;left:50%;bottom:0;width:calc(var(--btB)*.95);height:calc(var(--btB)*.28);border-radius:50%;border:1.5px solid rgba(199,210,254,.84);box-shadow:0 0 14px rgba(129,140,248,.40);transform:translate(-50%,50%) scale(.35,.35);opacity:0;pointer-events:none;will-change:transform,opacity}

   不再使用旧 .bt-balls 的 CSS 关键帧。三颗球由 AN10 的 rAF 时间轴驱动：
   - 起跳前压缩；空中按真抛物线运动，并按垂直速度做极轻的拉伸；

/* ===== PROSE GLASS V2 · 回答排版 + 液态玻璃 ===== */
:root{
  --prose:#e8e8ec;--prose-strong:#fff;--prose-mute:#a9a9b1;--prose-faint:#7e7e88;
  --glass-fill:radial-gradient(130% 160% at 4% -18%,rgba(139,124,255,.16),rgba(139,124,255,0) 56%),radial-gradient(90% 120% at 100% 0%,rgba(86,170,255,.09),rgba(86,170,255,0) 58%),linear-gradient(168deg,rgba(35,35,44,.72),rgba(18,18,23,.56));
  --glass-ring:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.045) 24%,rgba(139,124,255,.28) 56%,rgba(86,170,255,.17) 80%,rgba(255,255,255,.11));
  --glass-fill-soft:linear-gradient(168deg,rgba(31,31,39,.58),rgba(17,17,22,.42));
  --glass-ring-soft:linear-gradient(145deg,rgba(255,255,255,.20),rgba(255,255,255,.035) 26%,rgba(139,124,255,.22) 60%,rgba(86,170,255,.13) 84%,rgba(255,255,255,.08));
  --glass-light:inset 0 1px 0 rgba(255,255,255,.11),inset 0 -1px 0 rgba(0,0,0,.30),0 16px 36px -30px rgba(0,0,0,.95),0 2px 10px -9px rgba(0,0,0,.65);
}
html.light{
  --prose:#22262c;--prose-strong:#0a0d12;--prose-mute:#5d6470;--prose-faint:#8b919a;
  --glass-fill:radial-gradient(130% 160% at 4% -18%,rgba(99,102,241,.075),rgba(99,102,241,0) 56%),radial-gradient(90% 120% at 100% 0%,rgba(14,165,233,.055),rgba(14,165,233,0) 58%),linear-gradient(168deg,rgba(255,255,255,.88),rgba(247,248,252,.72));
  --glass-ring:linear-gradient(145deg,rgba(255,255,255,.98),rgba(255,255,255,.42) 24%,rgba(99,102,241,.24) 56%,rgba(14,165,233,.16) 80%,rgba(255,255,255,.88));
  --glass-fill-soft:linear-gradient(168deg,rgba(255,255,255,.84),rgba(247,248,252,.68));
  --glass-ring-soft:linear-gradient(145deg,rgba(255,255,255,.96),rgba(255,255,255,.40) 26%,rgba(99,102,241,.20) 60%,rgba(14,165,233,.13) 84%,rgba(255,255,255,.82));
  --glass-light:inset 0 1px 0 rgba(255,255,255,.96),inset 0 -1px 0 rgba(15,23,42,.035),0 16px 36px -30px rgba(15,23,42,.42),0 2px 10px -9px rgba(15,23,42,.14);
}
/* 正文层级：重点、弱化、节奏 */
.md{color:var(--prose);font-size:15px;line-height:1.72;letter-spacing:.004em;font-feature-settings:"kern" 1;text-rendering:optimizeLegibility}
.md::selection{background:rgba(122,167,255,.26)}
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md p{margin:.68em 0;text-wrap:pretty}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{color:var(--prose-strong);font-weight:650;line-height:1.36;letter-spacing:-.006em}
.md h1{font-size:1.42em;margin:1.12em 0 .56em;letter-spacing:-.015em}
.md h2{font-size:1.18em;margin:1.24em 0 .5em;padding-bottom:.34em;border-bottom:1px solid var(--line)}
.md h3{font-size:1.055em;margin:1em 0 .4em}
.md h4{font-size:1em;margin:.9em 0 .36em;color:var(--sub2)}
.md h5,.md h6{font-size:.9em;margin:.85em 0 .32em;color:var(--sub);letter-spacing:.05em;text-transform:uppercase}
.md strong,.md b{color:var(--prose-strong);font-weight:660;letter-spacing:.004em}
.md em,.md i{color:var(--prose);font-style:italic;letter-spacing:.008em}
.md del,.md s{color:var(--prose-faint);text-decoration-thickness:1px;text-decoration-color:rgba(248,113,113,.42)}
.md mark{background:rgba(251,191,36,.17);color:inherit;border-radius:4px;padding:0 3px}
.md a{color:var(--blue);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2.5px;text-decoration-color:rgba(122,167,255,.34);transition:color .15s,text-decoration-color .15s}
.md a:hover{color:#a9c6ff;text-decoration-color:currentColor}
.md a[target="_blank"]::after{content:"↗";display:inline-block;font-size:.7em;margin-left:.18em;opacity:.5;vertical-align:.16em}
html.light .md a{text-decoration-color:rgba(37,99,235,.26)}
html.light .md a:hover{color:#1d4ed8}
.md ul,.md ol{margin:.56em 0;padding-left:1.42em}
.md li{margin:.28em 0;padding-left:.1em;text-wrap:pretty}
.md li::marker{color:var(--prose-faint)}
.md ul>li::marker{color:rgba(122,167,255,.72)}
.md ol>li::marker{color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
.md li>ul,.md li>ol{margin:.24em 0}
.md li>p{margin:.24em 0}
.md li.task{list-style:none;margin-left:-1.26em}
.md .mdTask{display:inline-flex;align-items:center;justify-content:center;width:1.04em;height:1.04em;margin-right:.42em;border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:transparent;font-size:.78em;line-height:1;vertical-align:-.08em}
.md li.task.on .mdTask{background:rgba(74,222,128,.13);border-color:rgba(74,222,128,.3);color:var(--ok-fg)}
html.light .md li.task.on .mdTask{background:#eefbf3;border-color:#cdebd8}
.md blockquote{margin:.82em 0;padding:.62em .95em;border-left:2px solid rgba(122,167,255,.42);border-radius:0 10px 10px 0;color:var(--prose-mute);background:linear-gradient(90deg,rgba(122,167,255,.075),rgba(122,167,255,0) 74%)}
.md blockquote p{margin:.28em 0}
.md blockquote p:first-child{margin-top:0}
.md blockquote p:last-child{margin-bottom:0}
html.light .md blockquote{border-left-color:rgba(37,99,235,.34);background:linear-gradient(90deg,rgba(37,99,235,.055),rgba(37,99,235,0) 74%)}
.md hr{height:1px;border:0;margin:1.4em 0;background:linear-gradient(90deg,transparent,var(--line) 18%,var(--line) 82%,transparent)}
.md kbd{font-family:var(--mono);font-size:.8em;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--panel2);color:var(--prose-strong)}
.md sup,.md sub{font-size:.72em;line-height:0}
.md code{font-family:var(--mono);font-size:.86em;padding:1.5px 6px;border:1px solid rgba(122,167,255,.15);border-radius:6px;background:rgba(122,167,255,.09);color:var(--prose-strong);white-space:break-spaces}
html.light .md code{border-color:#e2e6ee;background:#f2f4f8;color:#1f2937}
.md .mdCode{margin:.72em 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code);box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 10px 24px -24px rgba(0,0,0,.8);max-width:100%;min-width:0}
html.light .md .mdCode{box-shadow:0 10px 24px -24px rgba(15,23,42,.28)}
.md .mdCodeBar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px 5px 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025);font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.04em}
html.light .md .mdCodeBar{background:#f1f2f5}
.md .mdCodeLang{font-weight:600;color:var(--sub);text-transform:lowercase}
.md .mdCopy{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;border-radius:7px;padding:2px 7px;font-size:10.5px;color:var(--sub);background:transparent;transition:background .15s,border-color .15s,color .15s}
.md .mdCopy .icv{width:12px;height:12px}
.md .mdCopy:hover{background:var(--hl);border-color:var(--line);color:var(--prose-strong)}
.md .mdCopy:active{transform:scale(.97)}
.md .mdCopy:focus-visible{outline:2px solid rgba(122,167,255,.5);outline-offset:1px}
.md .mdCopy.copied{color:var(--ok-fg)}
.md .mdCode pre.code{margin:0;border:0;border-radius:0;padding:11px 13px;background:transparent;color:var(--prose);font-size:12.5px;line-height:1.62;tab-size:2;-webkit-overflow-scrolling:touch;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain}
.md pre.code code{border:0;border-radius:0;padding:0;background:none;color:inherit;font-size:inherit;white-space:pre;tab-size:2}
.md .mdTableWrap{margin:.72em 0;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.025);-webkit-overflow-scrolling:touch;max-width:100%;overscroll-behavior-x:contain}
.md .mdCode pre.code{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.09) transparent}
.md .mdTableWrap{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
.md .mdCode pre.code::-webkit-scrollbar,.md .mdTableWrap::-webkit-scrollbar{width:4px;height:4px}
.md .mdCode pre.code::-webkit-scrollbar-track,.md .mdTableWrap::-webkit-scrollbar-track{background:transparent}
.md .mdCode pre.code::-webkit-scrollbar-thumb,.md .mdTableWrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:999px}
.md .mdCode pre.code:hover::-webkit-scrollbar-thumb,.md .mdTableWrap:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}

.histLoad-card{position:absolute;inset:0;display:block;border:1px solid transparent;border-radius:16px;background:linear-gradient(155deg,rgba(40,42,57,.86),rgba(18,19,27,.72)) padding-box,linear-gradient(145deg,rgba(255,255,255,.25),rgba(139,124,255,.22) 46%,rgba(86,170,255,.12) 72%,rgba(255,255,255,.05)) border-box;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 22px 44px -26px rgba(0,0,0,.9);backface-visibility:hidden}
html.light .histLoad-card{background:linear-gradient(155deg,rgba(255,255,255,.96),rgba(244,246,255,.82)) padding-box,linear-gradient(145deg,rgba(255,255,255,.98),rgba(99,102,241,.17) 48%,rgba(14,165,233,.12) 74%,rgba(255,255,255,.78)) border-box;box-shadow:inset 0 1px 0 rgba(255,255,255,.98),0 22px 40px -28px rgba(15,23,42,.3)}
.histLoad-card.back{transform:translate3d(-5px,-14px,0) rotate(-4.5deg) scale(.93);opacity:.34;animation:histBack 5.2s ease-in-out infinite}
.histLoad-card.mid{transform:translate3d(5px,-7px,0) rotate(3.4deg) scale(.965);opacity:.56;animation:histMid 4.6s ease-in-out infinite}
.histLoad-card.front{display:flex;flex-direction:column;gap:6px;padding:10px 11px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 18px 46px -22px rgba(0,0,0,.95),0 0 34px -18px rgba(125,211,252,.45);animation:histFront 4.1s ease-in-out infinite}
.histLoad-card.front::before{content:'';position:absolute;left:-50%;top:-60%;width:70%;height:220%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.22) 42%,rgba(125,211,252,.16) 52%,rgba(255,255,255,0));filter:blur(.4px);transform:rotate(12deg) translateX(-180%);animation:histGlint 4.2s cubic-bezier(.34,0,.2,1) .9s infinite;pointer-events:none}
html.light .histLoad-card.front::before{background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.72) 42%,rgba(125,211,252,.38) 52%,rgba(255,255,255,0))}
.histLoad-head{display:flex;align-items:center;gap:8px;height:23px;flex:none}
.histLoad-core{position:relative;flex:none;width:23px;height:23px;border-radius:7px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(120% 120% at 20% 10%,rgba(255,255,255,.26),rgba(255,255,255,0) 50%),linear-gradient(135deg,#7c3aed,#6366f1 52%,#0ea5e9);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 5px 12px -6px rgba(99,102,241,.9);animation:histCore 3.2s ease-in-out infinite}
.histLoad-core svg{display:block;width:72%;height:72%;overflow:visible;position:relative;z-index:1}
.histLoad-core path{fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.histLoad-core circle{fill:#fff}
.histLoad-core circle+circle{fill:#dff5ff}
.histLoad-core::after{content:'';position:absolute;inset:-40%;background:linear-gradient(110deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.46) 50%,rgba(255,255,255,0) 62%);mix-blend-mode:screen;animation:histCoreSheen 3.2s ease-in-out infinite}
.histLoad-id{display:flex;flex:1;min-width:0;flex-direction:column;gap:4px}
.histLoad-id i{display:block;height:4px;border-radius:99px;background:linear-gradient(90deg,rgba(255,255,255,.23),rgba(255,255,255,.07));box-shadow:inset 0 .5px 0 rgba(255,255,255,.08)}
.histLoad-id i:first-child{width:47%}
.histLoad-id i:last-child{width:30%}
html.light .histLoad-id i{background:linear-gradient(90deg,rgba(30,41,59,.20),rgba(30,41,59,.055))}
.histLoad-user{display:block;width:64px;height:17px;margin:1px 0 0 auto;border-radius:8px 8px 3px 8px;background:linear-gradient(135deg,rgba(155,131,255,.78),rgba(86,170,255,.56));box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 5px 12px -9px rgba(99,102,241,.8);animation:histBubble 3.9s ease-in-out infinite}
.histLoad-ai{display:flex;flex-direction:column;gap:5px;min-height:0;margin-top:1px}
.histLoad-ai i{position:relative;display:block;height:4px;border-radius:99px;overflow:hidden;background:linear-gradient(90deg,rgba(255,255,255,.20),rgba(255,255,255,.055) 64%,rgba(255,255,255,.02))}
.histLoad-ai i:nth-child(1){width:90%}
.histLoad-ai i:nth-child(2){width:100%}
.histLoad-ai i:nth-child(3){width:62%}
html.light .histLoad-ai i{background:linear-gradient(90deg,rgba(30,41,59,.17),rgba(30,41,59,.05) 64%,rgba(30,41,59,.02))}
.histLoad-ai i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(186,230,253,0),rgba(186,230,253,.36),rgba(186,230,253,0));transform:translateX(-110%);animation:histLine 3s ease-in-out infinite}
.histLoad-ai i:nth-child(2)::after{animation-delay:.18s}
.histLoad-ai i:nth-child(3)::after{animation-delay:.36s}
.histLoad-orbit{position:absolute;left:50%;top:50%;width:230px;height:154px;border:1px solid rgba(139,124,255,.10);border-radius:50%;transform:translate(-50%,-50%) rotate(-9deg);pointer-events:none}
.histLoad-orbit.o2{width:206px;height:136px;border-color:rgba(86,170,255,.08);transform:translate(-50%,-50%) rotate(12deg)}
.histLoad-orbit::before{content:'';position:absolute;left:14%;top:-2px;width:4px;height:4px;border-radius:50%;background:#dbeafe;box-shadow:0 0 8px rgba(125,211,252,.9);animation:histOrbitDot 3.4s ease-in-out infinite}
.histLoad-orbit.o2::before{left:auto;right:16%;top:auto;bottom:-2px;background:#c4b5fd;animation-delay:-1.6s}
html.light .histLoad-orbit{border-color:rgba(99,102,241,.10)}
html.light .histLoad-orbit.o2{border-color:rgba(14,165,233,.08)}
.histLoad-scan{position:absolute;z-index:2;left:18px;right:18px;top:26px;height:36px;border-radius:12px;background:linear-gradient(180deg,rgba(186,230,253,0),rgba(186,230,253,.13) 38%,rgba(255,255,255,.20) 50%,rgba(186,230,253,.10) 62%,rgba(186,230,253,0));filter:blur(1.5px);mix-blend-mode:screen;pointer-events:none;opacity:.9;animation:histScan 3.1s cubic-bezier(.42,.02,.22,1) infinite}
html.light .histLoad-scan{mix-blend-mode:normal;opacity:.72;background:linear-gradient(180deg,rgba(99,102,241,0),rgba(99,102,241,.08) 38%,rgba(255,255,255,.75) 50%,rgba(14,165,233,.06) 62%,rgba(99,102,241,0))}
.histLoad-mote{position:absolute;width:3px;height:3px;border-radius:50%;background:#dbeafe;box-shadow:0 0 7px rgba(125,211,252,.85);opacity:0;animation:histMote 4.8s ease-in-out infinite;pointer-events:none}
.histLoad-mote.m1{left:8px;bottom:42px;animation-delay:-.6s}
.histLoad-mote.m2{right:14px;top:42px;width:2px;height:2px;animation-delay:-2.1s}
.histLoad-mote.m3{left:30px;top:30px;width:2px;height:2px;animation-delay:-3.4s}
.histLoad-copy{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:1px}
.histLoad-eyebrow{display:flex;align-items:center;gap:7px;font-size:9px;font-weight:650;line-height:1;letter-spacing:.21em;color:var(--dim);text-transform:uppercase}
.histLoad-eyebrow i{width:4px;height:4px;border-radius:50%;background:#8b7cff;box-shadow:0 0 9px rgba(139,124,255,.75);animation:histPulse 2.1s ease-in-out infinite}
.histLoad-phrase{max-width:19em;min-height:1.55em;font-size:14px;line-height:1.55;font-weight:520;letter-spacing:.012em;background:linear-gradient(100deg,var(--sub) 0%,var(--fg) 44%,var(--sub) 68%,var(--sub) 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:histTextFlow 4.2s ease-in-out infinite}
.histLoad-ticks{display:flex;align-items:center;gap:5px;height:4px}
.histLoad-ticks i{width:4px;height:4px;border-radius:50%;background:rgba(139,124,255,.52);animation:histTick 1.9s ease-in-out infinite}
.histLoad-ticks i:nth-child(2){animation-delay:.16s}
.histLoad-ticks i:nth-child(3){animation-delay:.32s}
@keyframes histAura{0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(.96)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
@keyframes histCardsIn{from{opacity:0;transform:translate3d(0,10px,0) scale(.975)}to{opacity:1;transform:none}}
@keyframes histBack{0%,100%{transform:translate3d(-5px,-14px,0) rotate(-4.5deg) scale(.93)}50%{transform:translate3d(-7px,-19px,0) rotate(-3.2deg) scale(.935)}}
@keyframes histMid{0%,100%{transform:translate3d(5px,-7px,0) rotate(3.4deg) scale(.965)}50%{transform:translate3d(7px,-11px,0) rotate(2.4deg) scale(.97)}}
@keyframes histFront{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-3px,0)}}
@keyframes histGlint{0%,58%{transform:rotate(12deg) translateX(-180%);opacity:0}66%{opacity:.85}100%{transform:rotate(12deg) translateX(360%);opacity:0}}
@keyframes histCore{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 5px 12px -6px rgba(99,102,241,.9)}50%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 6px 16px -6px rgba(99,102,241,1),0 0 18px -5px rgba(125,211,252,.8)}}
@keyframes histCoreSheen{0%,64%{transform:translateX(-85%) rotate(20deg);opacity:0}72%{opacity:.7}100%{transform:translateX(85%) rotate(20deg);opacity:0}}
@keyframes histBubble{0%,100%{opacity:.8;transform:translateY(0)}45%{opacity:1;transform:translateY(-1px)}}
@keyframes histLine{0%,50%{transform:translateX(-110%);opacity:0}66%{opacity:.9}100%{transform:translateX(110%);opacity:0}}
@keyframes histOrbitDot{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1.2)}}
@keyframes histScan{0%{transform:translateY(-18px);opacity:0}16%{opacity:.8}78%{opacity:.55}100%{transform:translateY(100px);opacity:0}}
@keyframes histMote{0%{opacity:0;transform:translate3d(0,12px,0) scale(.6)}20%{opacity:.8}68%{opacity:.3}100%{opacity:0;transform:translate3d(12px,-34px,0) scale(1.2)}}
@keyframes histPulse{0%,100%{opacity:.5;box-shadow:0 0 5px rgba(139,124,255,.45)}50%{opacity:1;box-shadow:0 0 12px rgba(139,124,255,.9)}}
@keyframes histTextFlow{0%,100%{background-position:180% 0}50%{background-position:-55% 0}}
@keyframes histTick{0%,70%,100%{opacity:.28;transform:translateY(0)}35%{opacity:.95;transform:translateY(-2px)}}
@media (max-width:380px){
  .histLoad-stage{height:162px;transform:scale(.92);margin:-3px 0 -2px}
  .histLoad-phrase{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){
  .histLoad *,.histLoad *::before,.histLoad *::after{animation:none!important;transition:none!important}
  .histLoad-scan,.histLoad-mote{display:none}
}
</style>

<style id="nexus-motion-system">
/* Motion authority: feedback → surfaces → navigation → brand. Durations are also read by JS. */
:root{--motion-press:100ms;--motion-fast:160ms;--motion-exit:180ms;--motion-surface:240ms;--motion-view:280ms;--motion-brand:420ms;--motion-ease:cubic-bezier(.22,1,.36,1);--motion-standard:cubic-bezier(.4,0,.2,1);--motion-leave:cubic-bezier(.4,0,1,1)}
#top .tb,#wsBar button,#runBar button,#listBtns button,#engSeg .es,#imgB,#micB,#mdlB,#qB,.qchip .qbtn,.sh-x,.mp-x,#quoteX,.mdCopy,.pfbtn,#sendB,#stopB2,.ebadge,.thread .more,.grp .ghead .gfiles,.grp .ghead .gnew{
  transition:transform var(--motion-press) var(--motion-ease),color var(--motion-fast) ease,opacity var(--motion-fast) ease,box-shadow var(--motion-fast) ease,background-color var(--motion-fast) ease,border-color var(--motion-fast) ease;
}
#top .tb:active,#wsBar button:active,#runBar button:active,#listBtns button:active,#engSeg .es:active,#imgB:active,#micB:active,#mdlB:active,#qB:active,.qchip .qbtn:active,.sh-x:active,.mp-x:active,#quoteX:active,.mdCopy:active,.pfbtn:active,#sendB:not(:disabled):active,#stopB2:active,.ebadge:active,.thread .more:active,.grp .ghead .gfiles:active,.grp .ghead .gnew:active{transform:scale(.97)}
#top .tb::after,#wsBar button::after,#runBar button::after,#listBtns button::after,#engSeg .es::after,#imgB::after,#micB::after,#mdlB::after,#qB::after,.qchip .qbtn::after,.sh-x::after,.mp-x::after,#quoteX::after,.mdCopy::after,.pfbtn::after,#sendB::after,#stopB2::after,.ebadge::after{animation:none;opacity:.48}
.ebadge.flip{animation:nxBadge var(--motion-surface) var(--motion-ease)}
.ebadge.flip svg{animation:nxIcon var(--motion-surface) var(--motion-ease)}
@keyframes nxBadge{from{opacity:.6;transform:translateY(2px) scale(.97)}to{opacity:1;transform:none}}
@keyframes nxIcon{from{opacity:.35;transform:scale(.86)}to{opacity:1;transform:none}}
#threadList.listIn{animation:listIn var(--motion-surface) var(--motion-ease)}
@keyframes listIn{from{opacity:.65;transform:translateY(4px)}to{opacity:1;transform:none}}
#sheetWrap.show,#sheetWrap.closing{display:flex}
#sheetWrap.show{animation:nxScrimIn var(--motion-fast) linear both}
#sheetWrap.show #sheet{animation:nxSheetIn var(--motion-surface) var(--motion-ease) both;transform-origin:50% 100%}
#sheetWrap.closing{animation:nxScrimOut var(--motion-exit) linear both;pointer-events:none}
#sheetWrap.closing #sheet{animation:nxSheetOut var(--motion-exit) var(--motion-leave) both}
@keyframes nxScrimIn{from{background-color:transparent}to{background-color:var(--ovl)}}
@keyframes nxScrimOut{from{background-color:var(--ovl)}to{background-color:transparent}}
@keyframes nxSheetIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes nxSheetOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(10px)}}
#sheetWrap.show #sheet.anchored{animation-name:nxPopoverIn;transform-origin:50% 0}
#sheetWrap.closing #sheet.anchored{animation-name:nxPopoverOut}
@keyframes nxPopoverIn{from{opacity:0;transform:translateY(4px) scale(.985)}to{opacity:1;transform:none}}
@keyframes nxPopoverOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(3px) scale(.99)}}
#mdlPop.show,#mdlPop.closing{display:block}
#mdlPop.show #mdlIn{animation:nxPopoverIn var(--motion-surface) var(--motion-ease) both;transform-origin:50% 100%}
#mdlPop.closing{pointer-events:none}
#mdlPop.closing #mdlIn{animation:nxPopoverOut var(--motion-exit) var(--motion-leave) both}
#approvalWrap.show,#approvalWrap.closing{display:flex}
#approvalWrap.show{animation:nxScrimIn var(--motion-fast) linear both}
#approvalWrap.show #approval{animation:nxSheetIn var(--motion-surface) var(--motion-ease) both}
#approvalWrap.closing{animation:nxScrimOut var(--motion-exit) linear both;pointer-events:none}
#approvalWrap.closing #approval{animation:nxSheetOut var(--motion-exit) var(--motion-leave) both}
.lg-bead{animation-duration:var(--motion-view);animation-timing-function:var(--motion-ease)}
@media(min-width:720px){#sheetWrap.show #sheet:not(.anchored){animation-name:nxPopoverIn;transform-origin:center}#sheetWrap.closing #sheet:not(.anchored){animation-name:nxPopoverOut}}
/* One reveal and one signal; no legacy scan/ripple/impact layer competes with the logo. */
#boot .bt-wrap{gap:calc(var(--btT)*.2);transform:translateY(-3vh)}
#boot .bt-tile{animation:nxBrandIn var(--motion-brand) var(--motion-ease) both}
#boot .bt-tile::before,#boot .bt-tile::after,#boot .bt-lock::before,#boot .bt-lock::after,#boot .bt-sheen{animation:none!important;opacity:0!important}
#boot .bt-glow{animation:nxGlow 700ms var(--motion-ease) both;filter:none}
@keyframes nxBrandIn{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}

/* ============ 徽标彗星引擎 LOGO COMET（∞ 巡航 · 断线冻结 · 重连提速一圈） ============ */
const LC={pairs:[],prev:0,phase:0,t0:0,boost:0,ready:false,raf:0};
function logoCometInit(){
  try{
    LC.ready=true; LC.prev=performance.now(); LC.t0=performance.now();
    document.querySelectorAll('#logo svg, #boot .bt-tile svg').forEach(function(svg){
      const c=svg.querySelector('.lp-c'), t=svg.querySelector('.lp-t'), p=svg.querySelector('.lp-p');
      if(!c||!p) return;
      let len=0; try{ len=p.getTotalLength(); }catch(e){ len=0; }
      if(!(len>0)) return;
      LC.pairs.push({svg:svg,c:c,t:t||c,p:p,len:len,on:false,inBoot:!!(svg.closest&&svg.closest('#boot'))});
    });
  }catch(e){}
}
function logoCometResume(){
  if(LC.raf||document.hidden||fxReduced()) return;
  LC.pairs=LC.pairs.filter(q=>q.svg.isConnected);
  const lg=document.getElementById('logo');
  if(!LC.pairs.some(q=>q.inBoot||!(lg&&lg.classList.contains('ofl')))) return;
  LC.prev=performance.now(); LC.raf=requestAnimationFrame(logoCometTick);
}
function logoCometBoost(){ try{ LC.boost=performance.now()+1300; logoCometResume(); }catch(e){} }
function logoCometTick(){
  LC.raf=0;
  try{
    if(document.hidden||fxReduced()) return;
    LC.pairs=LC.pairs.filter(q=>q.svg.isConnected);
    const now=performance.now();
    let dt=now-(LC.prev||now); LC.prev=now; if(dt<0||dt>48) dt=48;
    const reduced=fxReduced();
    const lg=document.getElementById('logo');
    const hdrOfl=!!(lg && lg.classList.contains('ofl'));
    if(!LC.pairs.some(q=>q.inBoot||!hdrOfl)) return;
    const fast=now<LC.boost;
    if(!fast && (LC.skip=((LC.skip||0)+1)&1)){ LC.raf=requestAnimationFrame(logoCometTick); return; }
    LC.phase=(LC.phase+dt/(fast?1250:4600))%1;
    const ramp=Math.min(1,dt/130);
    const tri=LC.phase<.5?LC.phase*2:(1-LC.phase)*2;
    const dir=LC.phase<.5?1:-1;
    for(let i=0;i<LC.pairs.length;i++){
      const q=LC.pairs[i];
      if(!q.svg.isConnected) continue;
      const want=!reduced && !(q.inBoot && (now-LC.t0)<1050) && !(!q.inBoot && hdrOfl);
      q.a=want?Math.min(1,(q.a||0)+ramp):Math.max(0,(q.a||0)-ramp);
      if(q.a<=0.003){ q.c.style.opacity='0'; q.t.style.opacity='0'; continue; }
      const gap=Math.min(.14,2.0/q.len);
      let tp=tri-gap*dir; if(tp<0) tp=0; if(tp>1) tp=1;
      /* 端点吸收：脉冲画在白节点「下面」(见 svg 里 lp-t/lp-c 排在 lp-n 之前)，
         靠近端口时先淡出再被节点盖掉 —— 视觉上就是被端口吸进去；尾部阈值 >= gap，
         这样三角波折返那一刻 tp 被夹到 0/1 时尾部已经归零，不会瞬移。 */
      const absorb=Math.max(0,Math.min(1,(Math.min(tri,1-tri)-.02)/.09));
      const ta=Math.max(0,Math.min(1,(Math.min(tp,1-tp)-.115)/.09));
      const a=q.p.getPointAtLength(q.len*tri), b=q.p.getPointAtLength(q.len*tp);
      q.c.setAttribute('transform','translate('+a.x.toFixed(2)+','+a.y.toFixed(2)+')');
      q.t.setAttribute('transform','translate('+b.x.toFixed(2)+','+b.y.toFixed(2)+')');
      q.c.style.opacity=(q.a*absorb).toFixed(3);
      q.t.style.opacity=(q.a*ta*.85).toFixed(3);
    }
  }catch(e){}
  LC.raf=requestAnimationFrame(logoCometTick);
}
try{ logoCometInit(); logoCometResume(); }catch(e){}

function runtimeNewer(next, prev){
  if(!prev) return true;
  const ne=String((next&&(next.epoch||next.runtimeEpoch))||'');
  const pe=String((prev&&(prev.epoch||prev.runtimeEpoch))||'');
  const no=Number(next&&next.observedAt)||0, po=Number(prev&&prev.observedAt)||0;
  if(ne && pe && ne!==pe) return no>=po;
  const nv=Number(next&&next.version), pv=Number(prev&&prev.version);
  if(Number.isFinite(nv)&&Number.isFinite(pv)&&nv!==pv) return nv>pv;
  const nc=Number(next&&next.changedAt)||0, pc=Number(prev&&prev.changedAt)||0;
  if(nc!==pc) return nc>pc;
  return String(next&&next.phase||'')!==String(prev&&prev.phase||'') && no>=po;
}
function staleRuntime(tid,rt){
  const previous=S.runtimeById.get(String(tid));
  return !!(previous && rt && !runtimeNewer(rt,previous) &&
    (String(rt.epoch)!==String(previous.epoch)||Number(rt.version)!==Number(previous.version)||rt.phase!==previous.phase));
}
function rememberRuntime(tid, rt){
  if(!tid || !rt || typeof rt!=='object') return null;
  const key=String(tid), prev=S.runtimeById.get(key);
  if(prev && !runtimeNewer(rt,prev)) return prev;
  const next=Object.assign({},prev||{},rt);
  next.displayPhase=rt.phase;
  if(rt.event==='closed' || rt.phase==='closed'){
    const previousPhase=prev&&(prev.displayPhase||prev.phase);
    next.displayPhase=['completed','failed','stopped'].includes(previousPhase)?previousPhase:'idle';
  }
  S.runtimeById.set(key,next);
  return next;
}

function turnStatusView(t){
  const tid=String((t&&t.id)||S.curId||'');
  const rt=runtimeForThread(tid)||{};
  const current=!!(tid && String(S.curId||'')===tid);
  let phase=String(rt.displayPhase||(rt.event==='closed'?'idle':rt.phase)||'');
  if(phase==='closed') phase='idle';
  if(current && S.curMissing) phase='read_only';
  else if(current && S.stopping) phase='stopping';
  else if(current && S.running) phase=S.curWritable===false?'running_desktop':'running_mobile';
  else if(current && rt.running && !S.running) phase='syncing';
  else if(!phase && t && t.running) phase=t.writable===false?'running_desktop':'running_mobile';
  else if(!phase && t && t.writable===false) phase='desktop_locked';
  if(!phase) phase='idle';
  const eng=engineText(t);
  const q=Math.max(0,Number(rt.queueLen||t&&t.queueLen)||0);
  let mode='idle', label='空闲', detail='等待新消息';
  if(phase==='running_mobile'){ mode='run'; label='进行中'; detail='AN 手机端执行中'; }
  else if(phase==='running_desktop'){ mode='pc'; label='进行中'; detail=eng==='Codex'?'Codex 本体执行中':'电脑端执行中'; }
  else if(phase==='queued'){ mode='act'; label='排队中'; detail=q?('前方 '+q+' 条'):'等待执行'; }
  else if(phase==='stopping'){ mode='stop'; label='正在停止'; detail='等待回合结束'; }
  else if(phase==='stopped'){ mode='stop'; label='已停止'; detail='本回合已中断'; }
  else if(phase==='completed'){ mode='done'; label='已完成'; detail='本回合已结束'; }
  else if(phase==='failed'){ mode='fail'; label='执行失败'; detail=rt.error||'请查看本回合错误详情'; }
  else if(phase==='desktop_locked'){ mode='lock'; label='电脑端占用'; detail=eng==='Codex'?'Codex 本体占用':'其他客户端占用'; }
  else if(phase==='read_only'){ mode='lock'; label='只读'; detail='当前无法发送'; }
  else if(phase==='syncing'){ mode='syncing'; label='状态同步中'; detail='正在核对执行结果'; }
  const description=phase==='running_mobile'?'手机执行中':
    (phase==='running_desktop'?'电脑端执行中':(phase==='queued' && q?'排队中 · '+q+' 条':label));
  return {tid:tid,phase:phase,mode:mode,label:label,description:description,detail:detail,engine:eng,title:eng+' · '+description+' · '+detail};
}

function applyRuntimeState(tid, rt, opts){
  if(!tid || !rt || typeof rt!=='object') return false;
  const key=String(tid), before=S.runtimeById.get(key), next=rememberRuntime(key,rt);
  if(!next || (before && next===before && !runtimeNewer(rt,before))) return false;
  const th=S.threadsById&&S.threadsById.get(key); if(th) th.runtime=next;
  if(th && Number.isFinite(Number(next.queueLen))) th.queueLen=Number(next.queueLen);
  if(S.cur && String(S.cur.id||'')===key) S.cur.runtime=next;
  if(String(S.curId||'')===key){
    S.curWritable=next.writable!==false;
    if(next.phase==='running_mobile' || next.phase==='running_desktop' || next.phase==='stopped' || next.phase==='completed' || next.phase==='failed') S.stopping=false;
    const run=!!next.running;
    if((opts&&opts.applyRun!==false) && run!==S.running) setRunning(run,next.writable===false?'pc':'phone');
  }
  renderTurnStatus();
  if(!(opts&&opts.list===false)){
    try{ const lv=$('#listView'); if(S.wide || (lv && lv.style.display!=='none')) renderList(); }catch(e){}
  }
  return true;
}

let _qAt=0,_qBusy=false,_qPend=false;
async function refreshQueue(force){
  const id=S.curId; if(!id){ renderQueue([]); return; }
  const now=Date.now();
  if(!force && now-_qAt<1200) return;
  if(_qBusy){ _qPend=true; return; }
  _qBusy=true; _qAt=now;
  try{
    const r=await api('/api/threads/'+encodeURIComponent(id)+'/queue?engine='+curEng());
    if(S.curId!==id) return;
    S.queueTid=id;
    renderQueue((r&&r.data)||[]);
  }catch(e){}
  finally{
    _qBusy=false;
    if(_qPend){ _qPend=false; setTimeout(function(){ refreshQueue(true); },300); }
  }
}
const QJUMP_SETTLE_MS=6000;
const QJUMP_RETRY_MS=3500;
const QJUMP_POLL_MS=320;
const QJUMP_PROBE_MS=2400;
const QJUMP_WATCH_MS=45000;
const QJUMP_WATCH_POLL_MS=1600;
const QJUMP_NUDGE_MS=12500;
const QJUMP_WATCHES={};
function queueJumpTransient(e){
  const m=String((e&&e.message)||'');
  return (e&&(e.name==='AbortError'||e.name==='TypeError'))
      || /502|503|504|Failed to fetch|Load failed|NetworkError|network error|timed?\s*out|timeout|aborted/i.test(m);
}
function queueJumpNoRoute(e){
  const m=String((e&&e.message)||'');
  return !!(e&&e.status===404) || /unknown queue action|HTTP\s*404/i.test(m);
}
async function queueJumpProbe(id,qid,eng,timeoutMs){
  const ctl=(typeof AbortController!=='undefined')? new AbortController():null;
  let timer=0;
  if(ctl) timer=setTimeout(function(){ try{ctl.abort();}catch(e){} }, Math.max(600,timeoutMs||QJUMP_PROBE_MS));
  const qep=encodeURIComponent(eng||'codex');
  const qpath='/api/threads/'+encodeURIComponent(id)+'/queue?engine='+qep;
  const spath='/api/threads/'+encodeURIComponent(id)+'/state?engine='+qep;
  const one=function(path){
    try{ return api(path, ctl?{signal:ctl.signal}:{}).then(
      function(value){ return {ok:true,value:value}; },
      function(error){ return {ok:false,error:error}; }
    ); }catch(error){ return Promise.resolve({ok:false,error:error}); }
  };
  const rs=await Promise.all([one(qpath),one(spath)]);
  if(timer) clearTimeout(timer);
  const qr=rs[0]||{}, sr=rs[1]||{};
  const out={ok:false,present:null,queueLen:null,running:null,writable:null,
             queueError:null,stateError:null,queue:null,state:null};
  if(qr.ok){
    out.queue=qr.value||{};
    const rows=out.queue.data||[];
    out.ok=true;
    out.present=rows.some(function(it){ return String(it&&it.id)===String(qid); });
    out.queueLen=rows.length;
  }else out.queueError=qr.error;
  if(sr.ok){
    out.state=sr.value||{};
    out.running=!!out.state.running;
    out.writable=(out.state.writable!==false);
  }else out.stateError=sr.error;
  if(!out.ok) out.error=out.queueError||out.stateError;
  return out;
}
async function queueJumpSettle(id,qid,eng,opts){
  opts=opts||{};
  const deadline=Date.now()+Math.max(500,(opts.deadlineMs||QJUMP_SETTLE_MS));
  const pollMs=Math.max(120,(opts.pollMs||QJUMP_POLL_MS));
  const probeMs=Math.max(600,(opts.probeMs||QJUMP_PROBE_MS));
  let last=null, lastErr=null;
  do{
    const p=await queueJumpProbe(id,qid,eng,probeMs);
    if(p.ok){
      last=p;
      if(!p.present) return {state:'gone',probe:p};
    }else lastErr=p.error||p.queueError||p.stateError;
    const left=deadline-Date.now();
    if(left>0) await new Promise(function(res){ setTimeout(res,Math.min(pollMs,left)); });
  }while(Date.now()<deadline);
  if(last) return {state:last.present?'present':'gone',probe:last};
  return {state:'unknown',probe:null,error:lastErr};

async function queueJumpSettleResult(id,qid,eng,interrupted,ms,okMessage,opts){

  if(s.state==='gone'){
    return {ok:true,engine:eng,interrupted:!!interrupted,started:true,
            message:okMessage||(interrupted?'已打断当前回合，正在发送这条':'当前空闲，已直接发送')};
  }
  if(s.state==='present'){
    const probe=s.probe||{};
    if(probe.running===true){
      return {ok:true,engine:eng,interrupted:!!interrupted,started:false,uncertain:true,pending:true,
              reason:'still_running',
              message:'打断请求已发出；当前回合正在收尾，这条仍在队列，会继续自动启动'};
    }
    if(probe.running===false){
      return {ok:true,engine:eng,interrupted:!!interrupted,started:false,uncertain:true,pending:true,
              reason:'still_queued',
              message:'打断已发出；这条仍在队列里等待启动，页面会继续确认（没有丢）'};
    }
    return {ok:true,engine:eng,interrupted:!!interrupted,started:false,uncertain:true,pending:true,
            reason:'state_unknown',
            message:'这条还在队列里，但暂时读不到运行状态；页面会自动刷新'};
  }
  return {ok:true,engine:eng,interrupted:!!interrupted,started:false,uncertain:true,pending:true,

function queueJumpWatch(id,qid,eng,interrupted,opts){
  opts=opts||{};
  id=String(id||''); qid=String(qid||'');
  if(!id||!qid) return;
  const key=id+'|'+qid;
  const old=QJUMP_WATCHES[key];
  if(old && old.timer){ try{ clearTimeout(old.timer); }catch(e){} }
  const w={timer:0,lastNudge:0,ended:false,startedAt:Date.now()};
  const maxMs=Math.max(1200,opts.maxMs||QJUMP_WATCH_MS);
  const pollMs=Math.max(400,opts.pollMs||QJUMP_WATCH_POLL_MS);
  const nudgeMs=Math.max(800,opts.nudgeMs||QJUMP_NUDGE_MS);
  const sameCur=function(){ return String(S.curId)===id; };
  const finish=function(){ w.ended=true; if(QJUMP_WATCHES[key]===w) delete QJUMP_WATCHES[key]; };
  const schedule=function(ms){ if(w.ended) return; w.timer=setTimeout(tick,Math.max(250,ms)); };
  const nudge=async function(){
    if(w.ended || !sameCur()) return;
    const gap=Date.now()-w.lastNudge;
    if(gap<nudgeMs) return;
    w.lastNudge=Date.now();
    try{
      await api('/api/threads/'+encodeURIComponent(id)+'/queue/send',
        {method:'POST',body:{queuedSubmissionId:qid}});
    }catch(e){}
  };
  const tick=async function(){
    if(w.ended) return;
    if(QJUMP_WATCHES[key]!==w){ finish(); return; }
    let p=null;
    try{ p=await queueJumpProbe(id,qid,eng,opts.probeMs||QJUMP_PROBE_MS); }catch(e){}
    if(w.ended) return;
    const elapsed=Date.now()-w.startedAt;
    if(p && p.ok && !p.present){
      if(sameCur()){
        try{ refreshQueue(true); resyncRun(); }catch(e){}
        toast(p.running===true?'已发送：这条已经开始执行':'这条已离开队列，正在刷新执行状态',3200,'bolt');
      }
      finish(); return;
    }
    if(p && p.ok && p.present && p.writable===false){
      if(sameCur()) toast('电脑端仍占着这条会话；消息没有丢，可在发送键旁强制接管',5000,'warn');
      finish(); return;
    }
    if(elapsed>=maxMs){
      if(sameCur()){
        try{ refreshQueue(true); resyncRun(); }catch(e){}
        toast((p && p.ok && p.present)
          ? '这条仍在队列里，没有丢；可以再点一次箭头重试'
          : '暂时无法确认这条是否启动；没有丢，页面会继续刷新',5000,'warn');
      }
      finish(); return;
    }
    if(p && p.ok && p.present && p.running===false && elapsed>=Math.min(nudgeMs,maxMs-800)) await nudge();
    if(sameCur()){ try{ refreshQueue(true); }catch(e){} }
    schedule(pollMs);
  };
  QJUMP_WATCHES[key]=w;
  schedule(800);
}
async function queueJumpSendNow(id,qid,eng,interrupted,okMessage,opts){
  opts=opts||{};
  try{
    const sr=await api('/api/threads/'+encodeURIComponent(id)+'/queue/send',
      {method:'POST',body:{queuedSubmissionId:qid}});
    if(sr && sr.ok===false){
      if(sr.reason==='pc_holds_lock') return {ok:false,engine:(sr&&sr.engine)||eng,reason:'pc_holds_lock',message:sr.message};
      /* 服务端说没启动，不代表 QueuePump 没抢走；以队列真值为准。 */
      return await queueJumpSettleResult(id,qid,eng,interrupted,
        opts.retryMs||QJUMP_RETRY_MS,'',opts);
    }
    return {ok:true,engine:(sr&&sr.engine)||eng,interrupted:!!interrupted,started:true,
            message:okMessage||(interrupted?'已打断当前回合，正在发送这条':'当前空闲，已直接发送')};
  }catch(e){
    const m=String((e&&e.message)||'');
    if(/电脑端占用|写锁|thread_in_use/i.test(m)){
      return {ok:false,engine:eng,reason:'pc_holds_lock',message:m};
    }
    if(e && (e.status===401||e.status===403)) throw e;
    /* 发送接口报错 ≠ 没发出去：先看队列里这条还在不在，再决定说什么。 */
    return await queueJumpSettleResult(id,qid,eng,interrupted,
      interrupted?(opts.retryMs||QJUMP_RETRY_MS):(opts.settleMs||QJUMP_SETTLE_MS),'',opts);
  }

async function queueJumpRequest(id,qid,opts){
  opts=opts||{};
  const eng=opts.eng||curEng();
  const base='/api/threads/'+encodeURIComponent(id)+'/queue/'+encodeURIComponent(qid);
  const settleMs=opts.settleMs||QJUMP_SETTLE_MS;
  const settleOpts={pollMs:opts.pollMs,probeMs:opts.probeMs};
  const settleResult=function(interrupted,ms,okMessage){
    return queueJumpSettleResult(id,qid,eng,interrupted,ms,okMessage,settleOpts);
  };
  const authFail=function(e){ return !!(e && (e.status===401||e.status===403)); };
  try{
    const jr=await api(base+'/jump',{method:'POST',body:{}});
    if(jr && jr.ok) return jr;
    if(jr && jr.reason==='pc_holds_lock') return jr;
    if(jr && (jr.reason==='not_found'||jr.reason==='empty')){
      return {ok:true,engine:(jr&&jr.engine)||eng,interrupted:false,started:true,alreadyGone:true,
              message:'这条已经离开队列（可能已经发出），正在刷新执行状态'};
    }
    /* not_found / empty / start_failed：先对账。队列里没了，就是成功的另一种写法。 */
    return await settleResult(!!(jr&&jr.interrupted),settleMs,
      (jr&&jr.interrupted)?'已打断当前回合，正在发送这条':'当前空闲，已直接发送');
  }catch(e){
    if(authFail(e)) throw e;
    if(queueJumpNoRoute(e)){
      /* 旧网关没有 /jump：置顶 + interrupt + 对账。下面每一步失败都先查真值，
         不能因为一次 502/超时/短轮询没看到消失就报「打断失败」。 */
    }else{
      /* 504/502/超时，甚至 500：都不凭一次返回判失败。 */
      return await settleResult(true,settleMs,'打断请求已发出，这条已离开队列');
    }
  }
  try{
    await api(base+'/top',{method:'POST',body:{}});
  }catch(e){
    if(authFail(e)) throw e;
    const tm=String((e&&e.message)||'');
    if(/已不在了|not_found|empty|队列是空|already/i.test(tm)){
      const tp=await queueJumpProbe(id,qid,eng,settleOpts.probeMs||QJUMP_PROBE_MS);
      if(tp && tp.ok && !tp.present){
        return {ok:true,engine:eng,interrupted:false,started:true,alreadyGone:true,
                message:'这条已经离开队列（可能已经发出），正在刷新执行状态'};
      }
    }
    /* 置顶失败也不等于没发：可能刚好被泵取走。先对账。 */
    return await settleResult(false,QJUMP_RETRY_MS,'这条已离开队列，正在确认启动');
  }
  let ir=null;
  try{
    ir=await api('/api/threads/'+encodeURIComponent(id)+'/interrupt',
      {method:'POST',body:{clearQueue:false}});
  }catch(e){
    if(authFail(e)) throw e;
    return await settleResult(true,settleMs,'打断请求已发出，这条已离开队列');
  }
  if(ir && ir.reason==='pc_holds_lock'){
    return {ok:false,engine:(ir&&ir.engine)||eng,reason:'pc_holds_lock',message:ir.message};
  }
  if(ir && ir.stopped===false){
    /* 没打断成功（可能回合刚好自己结束）也先尝试直接发；发送报错继续对账。 */
    return await queueJumpSendNow(id,qid,(ir&&ir.engine)||eng,false);
  }
  if(ir && ir.stopped && ir.nextStarted===true){
    return {ok:true,engine:(ir&&ir.engine)||eng,interrupted:true,started:true,
            message:'已打断当前回合，正在发送这条'};
  }
  /* 旧网关没有 nextStarted；新网关也可能先回 false，再由 QueuePump 异步接棒。
     给泵至少一个完整节拍以上，只有「队列里还在 + 没运行」才判失败。 */
  let sr=await settleResult(true,settleMs,'');
  if(sr && sr.reason==='still_queued'){
    try{
      const sent=await queueJumpSendNow(id,qid,(ir&&ir.engine)||eng,true,'',
        Object.assign({},settleOpts,{settleMs:QJUMP_RETRY_MS,retryMs:QJUMP_RETRY_MS}));
      if(sent && sent.ok && !sent.pending) return sent;
      if(sent && sent.reason==='pc_holds_lock') return sent;
      if(sent && sent.pending) sr=sent;
    }catch(e){
      const sentMsg=String((e&&e.message)||'');
      if(/电脑端占用|写锁|thread_in_use/i.test(sentMsg)){
        return {ok:false,engine:eng,reason:'pc_holds_lock',message:sentMsg};
      }
      /* 一次发送失败不等于最终失败：只要队列里还在，继续交给页面确认和 QueuePump 推进。 */
    }
  }
  return sr;
}

async function resyncRun(){

    /* 只问真值(/state), 不再整包拉会话正文: 回合运行中每 8 秒搬 2MB 是手机端

    if(S.curId!==id) return;

    const w=(r.writable!==false);
    if(r.engine==='codex' && S.cur && (r.reasoningEffort || r.model)){
      const pending=PICK_LAST.get(id);
      if(!pending || pending.done){

        pickSyncFrom(S.cur);

    S.curWritable=w;
    S.lockInfo = w ? null : (r.lock || null);

    if(r.missingTranscript!==undefined || r.historyFallback!==undefined) chatRoOnly(!!r.missingTranscript || !!r.historyFallback, r.historyFallback?'history':'missing');
    if(running!==S.running) setRunning(running, w?'phone':'pc');

  }catch(e){}

function wsNoteSeq(ev){
  const s=Number(ev && ev.seq);
  if(!Number.isFinite(s)) return true;
  if(s<=lastSeq) return false;          // resent / replayed frame
  if(Number(ev.firstSeq||s)>lastSeq+1) gapResync(ev);
  lastSeq=s;

}
function connectWS(){
  try{ if(ws && (ws.readyState===0 || ws.readyState===1)) return; }catch(e){}
  if(!wsContractDoc){
    if(wsContractLoading)return;
    wsContractLoading=true;
    api('/api/rpc/contract',{timeout:5000}).then(function(doc){
      const version=Number(doc&&doc.websocket&&doc.websocket.version);
      const apiVersion=Number(doc&&doc.http&&doc.http.apiVersion);
      if(version!==1 || apiVersion!==1 || !doc.websocket.methods || !doc.websocket.defaultMethodPolicy) throw new Error('当前 AN 不支持此 WebSocket RPC 契约');
      wsContractDoc=doc;
    }).catch(function(){setConn(false);}).finally(function(){
      wsContractLoading=false;
      if(wsContractDoc)connectWS();else setTimeout(connectWS,Math.min(800*(++wsRetry),8000));
    });
    return;
  }
  const proto=(location.protocol==='https:')?'wss://':'ws://';
  try{ if(ws && ws.readyState===2) ws.close(); }catch(e){}
  const rpcVersion=Number(wsContractDoc.websocket.version);
  ws=new WebSocket(proto+location.host+'/api/ws?k='+encodeURIComponent(TOKEN)+'&rpc='+encodeURIComponent(String(rpcVersion))+'&last='+encodeURIComponent(String(lastSeq||0)));
  ws.onopen=()=>{ bootDone('ws'); setConn(true); wsRetry=0; if(S.watchTid) wsSetWatches([S.watchTid]);
    try{ const v=viewNow(); if(v && v.name==='chat') resyncLight(); }catch(e){} };
  ws.onmessage=e=>{ try{
    const ev=JSON.parse(e.data);
    if(ev.kind==='hb') return;
    if(ev.kind==='rpc.result') return;
    if(ev.kind==='rpc.error'){
      if(ev.error&&ev.error.code==='unauthorized'){setConn(false);try{ws.close(1008,'unauthorized');}catch(err){}}
      return;
    }
    if(ev.kind==='resume'){
      const s=Number(ev.seq);
      if(Number.isFinite(s)) lastSeq=s;
      if(ev.gap) gapResync(ev);
      if(S.curId)recoverTimeline(S.curId);
      return;
    }
    if(!wsNoteSeq(ev)) return;
    handleEvent(ev);
  }catch(err){} };
  ws.onclose=()=>{ setConn(false); wsRetry++; setTimeout(connectWS, Math.min(800*wsRetry, 8000)); };
  ws.onerror=()=>{ try{ ws.close(); }catch(e){} };
}
function handleEvent(ev){
  if(ev.kind==='gateway'){
    setConn(ev.status==='ready');
    if(ev.status==='dead'){ toast('后端 app-server 断开，正在自动重启…',4000); }
    return;
  }
  if(ev.kind==='request'){ pushApproval(ev); return; }
  if(ev.kind==='tail'){
    if(ev.backfill){if(ev.tid===S.curId)reloadChat();return;}
    applyTail(ev.tid, ev.ev||[]); return;
  }
  if(ev.kind==='notification'){
    try{
      const params=Object.assign({},ev.params||{},{eventSeq:ev.seq});
      onNotif(ev.method,params);
      if(params.threadId===S.curId){
        const node=S.nodes.get('item:'+String(params.itemId||(params.item&&params.item.id)||''));
        if(node&&ev.seq)node._appliedThrough=Math.max(Number(node._appliedThrough||0),ev.seq);
      }
    }catch(e){}
  }
}

const PENDING_KEY='arcPendingNew', PENDING_TTL=7*24*3600*1000, PENDING_MAX=20;
function pendingRows(){
  try{
    const raw=localStorage.getItem(PENDING_KEY);
    if(!raw) return [];
    const src=JSON.parse(raw);
    if(!Array.isArray(src)) return [];
    const now=Date.now(), out=[], seen=new Set();
    for(const x of src){
      if(!x || !x.id || seen.has(String(x.id))) continue;
      const at=Number(x.updatedAt||x.createdAt||0);
      const ms=at>1e12?at:(at>0?at*1000:0);
      if(ms && now-ms>PENDING_TTL) continue;
      const row=Object.assign({},x,{
        id:String(x.id), cwd:cleanFsPath(x.cwd||''),
        engine:(x.engine==='claude'||x.engine==='workbuddy')?x.engine:'codex',
        _pendingNew:true
      });
      seen.add(row.id); out.push(row);
      if(out.length>=PENDING_MAX) break;
    }
    return out;
  }catch(e){ return []; }
}
function pendingWrite(list){
  try{ localStorage.setItem(PENDING_KEY, JSON.stringify((list||[]).slice(0,PENDING_MAX))); }catch(e){}
}
function pendingAdd(t){
  if(!t||!t.id) return;
  const now=Math.floor(Date.now()/1000);
  const row={
    id:String(t.id), cwd:cleanFsPath(t.cwd||''),
    engine:(t.engine==='claude'||t.engine==='workbuddy')?t.engine:'codex',
    name:String(t.name||''), title:String(t.title||''), preview:String(t.preview||''),
    firstUserMessage:String(t.firstUserMessage||''),
    createdAt:Number(t.createdAt||0)||now, updatedAt:Number(t.updatedAt||0)||now,
    recencyAt:Number(t.recencyAt||t.updatedAt||0)||now
  };
  const list=pendingRows().filter(function(x){ return x.id!==row.id; });
  list.unshift(row); pendingWrite(list);
}
function pendingDrop(id){
  id=String(id||''); if(!id) return false;
  const list=pendingRows(), out=[];
  let hit=false;
  for(const x of list){ if(x.id===id){ hit=true; } else { out.push(x); } }
  if(hit) pendingWrite(out);

}
function pendingPatch(id, patch){

function pendingHydrate(){

function setThreads(list){
  const arr=Array.isArray(list)?list.slice():[];
  const seen=new Set(arr.map(function(x){ return x&&x.id; }));
  const keep=[];
  /* 后端列表里出现 = 已经是真会话：撤掉本地占位并清掉持久化记录。 */
  for(const p of pendingRows()){
    if(seen.has(p.id)){
      const real=arr.find(function(x){ return x&&x.id===p.id; });
      if(real) delete real._pendingNew;
      continue;
    }
    keep.push(p);
    if(!S.archived && (!p.engine || p.engine===S.engine)){
      if(!CHATCACHE[p.id]) CHATCACHE[p.id]=Object.assign({},p,{turns:[]});
      arr.unshift(p); seen.add(p.id);
    }
  }
  pendingWrite(keep);
  /* 同页内刚建、还没写进 localStorage 的占位也要留住。 */
  if(!S.archived) for(const t of (S.threads||[])){
    if(t && t._pendingNew && t.id && !seen.has(t.id) && (!t.engine || t.engine===S.engine)){
      arr.unshift(t); seen.add(t.id);
    }
  }
  for(const t of arr){
    if(!t||!t.id) continue;
    nativeThreadDirectory(t);
    if(t.runtime) rememberRuntime(t.id,t.runtime);
    const rt=S.runtimeById.get(String(t.id)); if(rt) t.runtime=rt;
  }
  S.threads=arr;
  S.threadsById=new Map(arr.map(function(t){ return [t.id,t]; }));
  renderTurnStatus();
}

    {ico:'folder',label:'浏览工程文件',onPick:()=>nav({name:'files',path:cwd||null,from:'list'})}];
  if(!S.viewonly){
    if(cwd && !S.archived){
      items.push({ico:'plus',label:'新建会话',onPick:()=>newThreadIn(cwd)});
      if(!/^O:[\\/]/i.test(cwd)){
        items.push({ico:'file-add',label:'新建文件…',onPick:()=>fsCreate({path:cwd},'file')});
        items.push({ico:'folder',label:'新建子文件夹…',onPick:()=>newFolderSheet(cwd,path=>folderCreatedSheet(path))});
      }
    }
    if(S.engine!=='codex')items.push({ico:'more',label:'调整会话顺序…',onPick:()=>projectThreadsSheet(cwd,true,groupKey)});
    items.push({ico:'trash',label:'管理 / 删除会话…',sub:'仅处理选中的会话，不删除磁盘文件夹',onPick:()=>projectThreadsSheet(cwd,false,groupKey)});
  }

}
function grpOrderSave(a){
  GRP_ORDER=a.slice(0,500);
  try{ localStorage.setItem(GRP_ORDER_KEY, JSON.stringify(GRP_ORDER)); }catch(e){}
}
function grpEffectiveOrder(){
  const rec=new Map();
  for(const t of S.threads){
    const k=grpKey(t.cwd), ts=tsNorm(t.recencyAt||t.updatedAt);
    if(!rec.has(k) || ts>rec.get(k)) rec.set(k,ts);
  }
  const seen=new Set(), listed=[];
  for(const k of GRP_ORDER){ if(rec.has(k) && !seen.has(k)){ seen.add(k); listed.push(k); } }
  const rest=[...rec.keys()].filter(k=>!seen.has(k)).sort((a,b)=>(rec.get(b)||0)-(rec.get(a)||0));
  return listed.concat(rest);
}
const GRP_DRAG={active:false,pending:false,pendingAt:0,pid:null,startX:0,startY:0,lastX:0,lastY:0,lastMoveAt:0,key:'',cwd:null,srcEl:null,h:null,ghost:null,ind:null,offY:0,didMove:false,longTimer:0,raf:0,suppressClickUntil:0,targetKey:'',targetPos:'after',rects:[],rectsScroll:-1,moveQueued:false,kind:'grp',tid:'',t:null,origCwd:'',targetCwd:null,targetEl:null,tip:null};

  window.addEventListener('pointerup',D._up,true);

function grpPointerMove(ev){
  const D=GRP_DRAG;
  if(!D.pending && !D.active) return;
  D.lastX=ev.clientX; D.lastY=ev.clientY; D.lastMoveAt=Date.now();
  const dx=ev.clientX-D.startX, dy=ev.clientY-D.startY;
  if(!D.active){
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(ev.pointerType==='touch'){
      if(dist>10) grpAbortPending();
      return;
    }
    if(dist<5) return;
    grpDragStart();
  }
  if(D.active){
    try{ ev.preventDefault(); }catch(e){}
    grpQueueMove();
  }
}
function grpAbortPending(){
  const D=GRP_DRAG;
  const h=D.h, pid=D.pid;
  grpClearTimer();
  D.pending=false; D.pid=null;
  if(h){
    try{ h.releasePointerCapture(pid); }catch(e){}
    try{ window.removeEventListener('pointermove',D._mv,true); }catch(e){}
    try{ window.removeEventListener('pointerup',D._up,true); }catch(e){}
    try{ window.removeEventListener('pointercancel',D._up,true); }catch(e){}
  }
}
function grpDragStart(){
  const D=GRP_DRAG;
  if(D.active || !D.pending) return;

  const h=D.h, r=h.getBoundingClientRect();

  gh.style.left=r.left+'px'; gh.style.top=r.top+'px'; gh.style.width=r.width+'px';

  if(D.kind==='thread') thrDragMove(); else grpDragMove();

function grpCollectRects(){

    const r=hr.getBoundingClientRect();
    out.push({el:g,top:r.top,h:r.height,left:r.left,width:r.width,bottom:g.getBoundingClientRect().bottom});
  }

}
function thrCollectTargets(){

  for(let i=0;i<gs.length;i++){

function thrDragMove(){
  const D=GRP_DRAG;
  if(!D.active || !D.ghost) return;
  const lv=$('#listView');
  if(lv && lv.scrollTop!==D.rectsScroll) thrCollectTargets();
  const dy=D.lastY-D.startY;
  if(Math.abs(dy)>3 || Math.abs(D.lastX-D.startX)>3) D.didMove=true;
  D.ghost.style.transform='translate3d(0,'+dy+'px,0) scale(1.015)';
  const rects=D.rects||[];
  let target=null, near=null, nd=1e9;
  for(let i=0;i<rects.length;i++){
    const r=rects[i];
    if(D.lastY>=r.top-2 && D.lastY<=r.bottom+2){ target=r; break; }
    const d=D.lastY<r.top?(r.top-D.lastY):(D.lastY-r.bottom);
    if(d<nd){ nd=d; near=r; }
  }
  if(!target && near && nd<=28) target=near;
  if(D.targetEl && D.targetEl!==(target&&target.el)) D.targetEl.classList.remove('grpdrophl');
  if(target){
    D.targetKey=target.key; D.targetCwd=target.cwd; D.targetEl=target.el;
    target.el.classList.add('grpdrophl');
  }else{
    D.targetKey=''; D.targetCwd=null; D.targetEl=null;
  }
  if(D.tip){
    if(target) D.tip.innerHTML='放到 <b>'+esc(baseName(target.cwd||'(无工程)'))+'</b>';
    else D.tip.textContent='拖到某个工程分组上松手';
  }
}
function grpQueueMove(){

}
function grpDragMove(){
  const D=GRP_DRAG;
  if(!D.active || !D.ghost) return;
  if(D.kind==='thread'){ thrDragMove(); return; }
  const lv=$('#listView');
  if(lv && lv.scrollTop!==D.rectsScroll) grpCollectRects();
  const dy=D.lastY-D.startY;
  if(Math.abs(dy)>3 || Math.abs(D.lastX-D.startX)>3) D.didMove=true;
  const rects=D.rects||[];
  let target=null;
  for(let i=0;i<rects.length;i++){
    if(D.lastY < rects[i].top + rects[i].h*0.55){ target=rects[i]; break; }
  }
  let top=0, left=0, width=0;
  if(target){
    top=target.top-3; left=target.left+8; width=Math.max(40,target.width-16);
    D.targetKey=target.el.dataset.gkey||''; D.targetPos='before';
  }else{
    const last=rects.length?rects[rects.length-1]:null;
    D.targetKey=''; D.targetPos='after';
    if(last){
      top=last.bottom-2; left=last.left+8; width=Math.max(40,last.width-16);
    }else{
      const r=lv?lv.getBoundingClientRect():{top:D.startY,left:0,width:0};
      top=r.top+10; left=r.left+12; width=Math.max(120,r.width-24);
    }
  }
  D.ghost.style.transform='translate3d(0,'+dy+'px,0) scale(1.018)';
  const ind=D.ind;
  if(ind){ ind.style.top=top+'px'; ind.style.left=left+'px'; ind.style.width=width+'px'; }
}
function grpAutoScroll(){
  const D=GRP_DRAG;
  if(!D.active){ D.raf=0; return; }
  if(D.lastMoveAt && Date.now()-D.lastMoveAt>15000){ grpDragFinish(false); return; }
  const lv=$('#listView');
  if(lv){
    const r=lv.getBoundingClientRect(), edge=64;
    let d=0;
    if(D.lastY < r.top+edge) d=-Math.min(16,Math.ceil((r.top+edge-D.lastY)/4));
    else if(D.lastY > r.bottom-edge) d=Math.min(16,Math.ceil((D.lastY-(r.bottom-edge))/4));
    if(d){ const before=lv.scrollTop; lv.scrollTop=before+d; if(lv.scrollTop!==before){ if(D.kind==='thread') thrCollectTargets(); else grpCollectRects(); grpDragMove(); } }
  }
  D.raf=requestAnimationFrame(grpAutoScroll);
}
function grpPointerUp(ev){
  const D=GRP_DRAG;
  if(D.active){ try{ ev.preventDefault(); }catch(e){} grpDragFinish(true); }
  else if(D.pending){ grpAbortPending(); }
}
function grpDragFinish(commit){
  const D=GRP_DRAG;
  grpClearTimer();
  const wasActive=D.active;
  const kind=D.kind, tid=D.tid, tRef=D.t, targetCwd=D.targetCwd, targetKey=D.targetKey, origKey=D.key;
  let threadMoved=false;
  if(wasActive){
    D.suppressClickUntil=Date.now()+450;
    if(commit && D.didMove && kind==='grp'){
      let order=grpEffectiveOrder();
      const k=D.key;
      order=order.filter(function(x){ return x!==k; });
      let idx=-1;
      if(D.targetKey) idx=order.indexOf(D.targetKey);
      if(idx<0) idx=order.length; else if(D.targetPos==='after') idx++;
      order.splice(idx,0,k);
      grpOrderSave(order);
    }else if(commit && D.didMove && kind==='thread'){
      threadMoved=(targetCwd!==null && targetKey && targetKey!==origKey);
    }
  }
  const gh=D.ghost, ind=D.ind, src=D.srcEl, h=D.h, pid=D.pid;
  if(ind){ ind.style.opacity='0'; setTimeout(function(){ try{ ind.remove(); }catch(e){} },150); }
  if(gh){ gh.classList.remove('on'); gh.classList.add('off'); setTimeout(function(){ try{ gh.remove(); }catch(e){} },170); }
  if(src) src.classList.remove(kind==='thread'?'thrsrc':'grpsrc');
  try{ document.querySelectorAll('#threadList > .grp.grpdrophl').forEach(function(g){ g.classList.remove('grpdrophl'); }); }catch(e){}
  document.body.classList.remove('grpdrag-on');
  try{ window.removeEventListener('touchmove',grpTouchBlock,{passive:false}); }catch(e){}
  if(D.raf){ cancelAnimationFrame(D.raf); D.raf=0; }
  if(h){
    try{ h.releasePointerCapture(pid); }catch(e){}
    try{ window.removeEventListener('pointermove',D._mv,true); }catch(e){}
    try{ window.removeEventListener('pointerup',D._up,true); }catch(e){}
    try{ window.removeEventListener('pointercancel',D._up,true); }catch(e){}
  }
  D.active=false; D.pending=false; D.pendingAt=0; D.pid=null; D.srcEl=null; D.h=null; D.ghost=null; D.ind=null;
  D.rects=[]; D.rectsScroll=-1; D.moveQueued=false; D.lastMoveAt=0;
  D.kind='grp'; D.tid=''; D.t=null; D.origCwd=''; D.targetCwd=null; D.targetEl=null; D.tip=null;
  if(wasActive && commit){
    if(kind==='thread'){
      if(threadMoved) void moveThreadTo(tRef, targetCwd, targetKey);
    }else{
      renderListAnimated();
    }
  }
}
function renderListAnimated(){
  if(fxReduced()){ renderList(); return; }
  const before=new Map();
  document.querySelectorAll('#threadList > .grp').forEach(function(g){ before.set(g.dataset.gkey,g.getBoundingClientRect().top); });
  renderList();
  document.querySelectorAll('#threadList > .grp').forEach(function(g){
    const old=before.get(g.dataset.gkey);
    if(old==null) return;
    const d=old-g.getBoundingClientRect().top;
    if(Math.abs(d)<1) return;
    g.style.transition='none'; g.style.transform='translateY('+d+'px)';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      g.style.transition='transform '+motionTime('surface')+'ms cubic-bezier(.22,1,.36,1)';
      g.style.transform='';
    }); });
    setTimeout(function(){ g.style.transition=''; g.style.transform=''; },320);
  });
}
async function moveThreadTo(t, destCwd, destKey){
  if(!t.engine || t.engine==='codex'){ toast('Codex 会话按真实工作目录归组；请在目标工程新建会话',4200); return false; }
  if(!t || !t.id) return false;
  const tid=t.id, old=t.cwd||'';
  const dest=(destCwd==null?'':String(destCwd));
  const label=baseName(dest||'(无工程)');
  let cacheOld=null, cacheHit=false;
  t.cwd=dest;
  const bt=S.threadsById.get(tid); if(bt) bt.cwd=dest;
  if(S.cur && S.curId===tid) S.cur.cwd=dest;
  renderListAnimated();
  try{
    await api('/api/threads/'+encodeURIComponent(tid)+'/move',{method:'POST',body:{cwd:dest,engine:t.engine||S.engine},timeout:20000});
    try{
      const cache=THCACHE[S.engine];
      if(cache){
        const it=cache.find(function(x){ return x.id===tid; });
        if(it){ cacheOld=it.cwd; cacheHit=true; it.cwd=dest; }
      }
    }catch(e){}
    pendingPatch(tid,{cwd:dest,updatedAt:Math.floor(Date.now()/1000)});
    toast('已移动到「'+label+'」',2400);
    return true;
  }catch(e){
    t.cwd=old; const b2=S.threadsById.get(tid); if(b2) b2.cwd=old;
    if(S.cur && S.curId===tid) S.cur.cwd=old;
    if(cacheHit){ try{ const cache=THCACHE[S.engine]; const it=cache&&cache.find(function(x){return x.id===tid;}); if(it) it.cwd=cacheOld; }catch(x){} }
    renderListAnimated();
    pendingPatch(tid,{cwd:old});
    toast(apiErrText(e,'移动会话'),5600);
    return false;
  }
}

function isInternalTestThread(t){
  if(t.pinned || t.name)return false;
  let src=t.source||t.threadSource||'';
  if(typeof src==='string' && src[0]==='{'){try{src=JSON.parse(src);}catch(e){}}
  if(src && typeof src==='object' && src.subagent)return true;
  const title=String(t.firstUserMessage||t.title||t.preview||'').trim();
  return /^(?:reply (?:with )?exactly\s*:?\s*[A-Z0-9_-]+(?:\s+and nothing else\.?)?|只回复(?:两个字母|两个字|四个字)?[：:]?\s*(?:OK|GS|AZ|通了|正常|可见|网关通了)|Use the shell to run: echo (?:ASTRA|ROUTER)-TOOL-OK)$/i.test(title);
}
function showInternalThreads(){try{return localStorage.getItem('anShowInternal')==='1';}catch(e){return false;}}
function isChildAgentThread(t){
  if(String(t.threadSource||t.thread_source||'').toLowerCase()==='subagent')return true;
  let source=t.source;
  if(typeof source==='string'){if(source.toLowerCase()==='subagent')return true;try{source=JSON.parse(source);}catch(e){return false;}}
  return !!(source&&typeof source==='object'&&Object.prototype.hasOwnProperty.call(source,'subagent'));
}
function renderList(){
  if(GRP_DRAG.active || (GRP_DRAG.pending && Date.now()-(GRP_DRAG.pendingAt||0)<6000)) return;
  const box=$('#threadList'); box.innerHTML='';
  $('#archNote').style.display=S.archived?'block':'none';
  const q=($('#searchIn').value||'').toLowerCase();
  let arr=S.threads.filter(t=>{
    if(isChildAgentThread(t))return false;
    if(S.engine!=='codex' && !S.archived && !q && !showInternalThreads() && isInternalTestThread(t))return false;
    if(!q) return true;
    return (((t.name||'')+' '+(t.title||'')+' '+(t.displayTitle||'')+' '+(t.preview||'')+' '+(t.projectName||'')+' '+(t.cwd||'')).toLowerCase().includes(q));
  });
  arr=arr.slice().sort((a,b)=>((tsNorm(b.recencyAt||b.updatedAt))-(tsNorm(a.recencyAt||a.updatedAt))));
  const groups=new Map();
  if(S.engine==='codex' && !S.archived && !q){
    for(const project of S.projects||[]){
      groups.set('project:'+project.id,{key:'project:'+project.id,cwd:project.path,name:project.name,position:project.position??1e9,items:[]});
    }
  }
  for(const t of arr){
    const key=threadGroupKey(t);
    if(!groups.has(key)) groups.set(key,{key,cwd:key==='projectless'?'':(t.projectRoot||t.cwd),name:t.projectName||(key==='projectless'?'未归入项目':''),position:t.projectPosition??1e9,items:[]});
    groups.get(key).items.push(t);
  }
  const _rank=new Map(grpEffectiveOrder().map((k,i)=>[k,i]));
  const garr=[...groups.values()].sort((a,b)=>{
    if(S.engine==='codex'){
      if(a.position!==b.position)return a.position-b.position;
      if(a.key.startsWith('project:')!==b.key.startsWith('project:'))return a.key.startsWith('project:')?-1:1;
      return Math.max(0,...b.items.map(t=>tsNorm(t.recencyAt||t.updatedAt)))-Math.max(0,...a.items.map(t=>tsNorm(t.recencyAt||t.updatedAt)));
    }
    const ia=_rank.has(grpKey(a.cwd))?_rank.get(grpKey(a.cwd)):1e9;
    const ib=_rank.has(grpKey(b.cwd))?_rank.get(grpKey(b.cwd)):1e9;
    if(ia!==ib) return ia-ib;
    const ra=Math.max(...a.items.map(t=>tsNorm(t.recencyAt||t.updatedAt)));
    const rb=Math.max(...b.items.map(t=>tsNorm(t.recencyAt||t.updatedAt)));
    return rb-ra;
  });
  for(const g of garr){
    g.items=orderedProjectThreads(g.items,g.cwd,g.key);
    const collapseKey=S.engine==='codex'?g.key:g.cwd;
    const gd=el('div','grp'+(S.collapsed.has(collapseKey)?' col':''));
    gd.dataset.gkey=g.key;
    const h=el('div','ghead');
